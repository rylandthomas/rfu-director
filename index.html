function effective(team,state,side,attr){
  const fatiguePenalty=(100-state.energy[side])*0.22;
  const playerPenalty=(15-state.players[side])*4.2;
  let v=team[attr] ?? 75;
  if(['defence','scrum','lineout','attack'].includes(attr)) v-=fatiguePenalty;
  if(['defence','attack'].includes(attr)) v-=playerPenalty;
  return clamp(v,25,100);
}

function resolveSinBins(state){
  for(const side of ['home','away']){
    const before=state.sinbin[side].length;
    state.sinbin[side]=state.sinbin[side].filter(returnMinute=>returnMinute>state.minute);
    const returned=before-state.sinbin[side].length;
    if(returned){
      state.players[side]+=returned;
      state.events.push({minute:state.minute,type:'PLAYER_RETURN',team:side});
    }
  }
}

function blockPossession(home,away,state){
  if(state.forcedPossessionHome!==null){
    return clamp(state.forcedPossessionHome+normal(0,1.5),32,68);
  }
  const hm=strategyModifiers(state,'home');
  const am=strategyModifiers(state,'away');
  const hAtk=effective(home,state,'home','attack')*hm.attack;
  const aAtk=effective(away,state,'away','attack')*am.attack;
  const hKick=effective(home,state,'home','kicking');
  const aKick=effective(away,state,'away','kicking');
  const edge=(hAtk-aAtk)*0.10+(hKick-aKick)*0.08+
    (home.form-away.form)*0.07+(home.coaching-away.coaching)*0.05+
    state.homeAdvantage*0.35+state.momentum*0.12;
  return clamp(50+edge+normal(0,5.5),32,68);
}

function blockTerritory(home,away,state,hPoss){
  const hm=strategyModifiers(state,'home');
  const am=strategyModifiers(state,'away');
  const edge=(effective(home,state,'home','kicking')*hm.kicking-effective(away,state,'away','kicking')*am.kicking)*0.16+
    (effective(home,state,'home','attack')-effective(away,state,'away','defence'))*0.10+
    state.homeAdvantage*0.3+state.momentum*0.15;
  return clamp(50+(hPoss-50)*0.17+edge+normal(0,5),30,70);
}

function applyWorkload(home,away,state,hPoss,hTerr){
  const phases=Math.max(5,Math.round(10+Math.abs(normal(0,3))));
  const hDefShare=(100-hPoss)/100;
  const aDefShare=hPoss/100;

  const hShortHand=15/state.players.home;
  const aShortHand=15/state.players.away;

  // Total team tackles rise slightly when short-handed because defensive spacing
  // worsens and possessions tend to require more repeat efforts.
  const hTackles=Math.max(1,Math.round(phases*hDefShare*1.55*(1+(hShortHand-1)*0.45)));
  const aTackles=Math.max(1,Math.round(phases*aDefShare*1.55*(1+(aShortHand-1)*0.45)));

  state.tackles.home+=hTackles;
  state.tackles.away+=aTackles;

  // Defensive work is much more expensive than controlled attacking possession.
  // Short-handed load is amplified because fewer players share each tackle,
  // reload and covering run.
  const hDefCost=hTackles*0.19*Math.pow(hShortHand,2.15);
  const aDefCost=aTackles*0.19*Math.pow(aShortHand,2.15);

  const hm=strategyModifiers(state,'home');
  const am=strategyModifiers(state,'away');
  const hAttackCost=phases*(hPoss/100)*0.045*hm.tempo;
  const aAttackCost=phases*((100-hPoss)/100)*0.045*am.tempo;

  state.energy.home=clamp(state.energy.home-hDefCost-hAttackCost,20,100);
  state.energy.away=clamp(state.energy.away-aDefCost-aAttackCost,20,100);

  return phases;
}

function scrumOutcome(home,away,state,attackingSide){
  const defendingSide=attackingSide==='home'?'away':'home';
  const atk=attackingSide==='home'?home:away;
  const def=attackingSide==='home'?away:home;
  const atkScrum=effective(atk,state,attackingSide,'scrum');
  const defScrum=effective(def,state,defendingSide,'scrum');
  const diff=atkScrum-defScrum;

  // Dominance increases pressure but never guarantees the decision.
  // Very dominant packs have a small extra risk of early push/overextension.
  const dominant=Math.max(0,diff);
  const earlyPushRisk=0.025+Math.max(0,dominant-10)*0.0025;
  if(chance(earlyPushRisk)){
    state.scrumErrors[attackingSide]++;
    state.events.push({minute:state.minute,type:'SCRUM_PENALTY_EARLY_PUSH',team:defendingSide});
    return {penalty:defendingSide};
  }

  const atkPenaltyChance=clamp(0.16+diff*0.012,0.05,0.48);
  const defPenaltyChance=clamp(0.12-diff*0.004,0.045,0.18);
  const r=Math.random();
  if(r<atkPenaltyChance){
    state.scrumPenalties[attackingSide]++;
    state.events.push({minute:state.minute,type:'SCRUM_PENALTY_WON',team:attackingSide});
    return {penalty:attackingSide};
  }
  if(r<atkPenaltyChance+defPenaltyChance){
    state.scrumPenalties[defendingSide]++;
    state.events.push({minute:state.minute,type:'SCRUM_PENALTY_WON',team:defendingSide});
    return {penalty:defendingSide};
  }
  return {penalty:null};
}



function applyForcedScoringEvents(state){
  for(const ev of state.forcedScoringEvents){
    if(ev.applied || ev.minute!==state.minute)continue;
    const side=ev.side;
    if(!['home','away'].includes(side))continue;

    if(ev.type==='penalty'){
      state.score[side]+=3;
      state.penaltyGoals[side]++;
      state.events.push({minute:state.minute,type:'PENALTY_GOAL_FORCED',team:side,points:3});
    }else if(ev.type==='drop_goal'){
      state.score[side]+=3;
      state.dropGoals[side]=(state.dropGoals[side]||0)+1;
      state.events.push({minute:state.minute,type:'DROP_GOAL_FORCED',team:side,points:3});
    }else if(ev.type==='try'){
      state.score[side]+=5;
      state.tries[side]++;
      state.events.push({minute:state.minute,type:'TRY_FORCED',team:side,points:5});
      if(ev.converted){
        state.score[side]+=2;
        state.conversions[side]++;
        state.events.push({minute:state.minute,type:'CONVERSION_FORCED',team:side,points:2});
      }
    }else{
      throw new Error('Unsupported forced scoring type: '+ev.type);
    }
    ev.applied=true;
  }
}

function applyForcedCards(state){
  for(const card of state.forcedCards){
    if(card.applied || card.minute!==state.minute)continue;
    const side=card.side;
    if(!['home','away'].includes(side))continue;

    if(card.type==='red'){
      state.players[side]=Math.max(13,state.players[side]-1);
      state.cards[side].red++;
      state.events.push({minute:state.minute,type:'RED_CARD_FORCED',team:side});
    }else if(card.type==='yellow'){
      state.players[side]=Math.max(13,state.players[side]-1);
      state.cards[side].yellow++;
      state.sinbin[side].push(state.minute+10);
      state.events.push({minute:state.minute,type:'YELLOW_CARD_FORCED',team:side,returns:state.minute+10});
    }
    card.applied=true;
  }
}

function maybeCard(team,state,side,oppTerritory){
  const discipline=team.discipline;
  const pressure=Math.max(0,oppTerritory-50);
  const yellowP=0.010+(100-discipline)*0.00065+pressure*0.00045;
  const redP=0.0007+(100-discipline)*0.000035;

  if(chance(redP)){
    state.players[side]=Math.max(13,state.players[side]-1);
    state.cards[side].red++;
    state.events.push({minute:state.minute,type:'RED_CARD',team:side});
    return;
  }
  if(chance(yellowP)){
    state.players[side]=Math.max(13,state.players[side]-1);
    state.cards[side].yellow++;
    state.sinbin[side].push(state.minute+10);
    state.events.push({minute:state.minute,type:'YELLOW_CARD',team:side,returns:state.minute+10});
  }
}


function scoreContext(state,side){
  const other=side==='home'?'away':'home';
  const diff=state.score[side]-state.score[other];
  const remaining=Math.max(0,80-state.minute);

  let mode='balanced';
  if(diff>=8 && remaining<=25)mode='close_game';
  else if(diff>0 && remaining<=20)mode='protect_lead';
  else if(diff<0 && Math.abs(diff)<=7 && remaining<=20)mode='chase_one_score';
  else if(diff<=-8 && remaining<=25)mode='chase_tries';

  return {diff,remaining,mode};
}

function strategyModifiers(state,side){
  const ctx=scoreContext(state,side);
  if(ctx.mode==='close_game')
    return {attack:0.82,kicking:1.18,risk:0.66,territory:1.15,tempo:0.82};
  if(ctx.mode==='protect_lead')
    return {attack:0.90,kicking:1.12,risk:0.76,territory:1.10,tempo:0.88};
  if(ctx.mode==='chase_one_score')
    return {attack:1.12,kicking:0.92,risk:1.18,territory:1.00,tempo:1.12};
  if(ctx.mode==='chase_tries')
    return {attack:1.25,kicking:0.82,risk:1.34,territory:0.95,tempo:1.20};
  return {attack:1,kicking:1,risk:1,territory:1,tempo:1};
}

function strategicPenaltyChoice(state,side,territory){
  const ctx=scoreContext(state,side);

  if(ctx.mode==='close_game')return territory>=38;
  if(ctx.mode==='protect_lead')return territory>=40;

  if(ctx.mode==='chase_one_score'){
    if(ctx.diff>=-3)return territory>=43;
    if(ctx.remaining<=10)return false;
    return territory>=51 && Math.random()<0.30;
  }

  if(ctx.mode==='chase_tries'){
    if(ctx.remaining<=15)return false;
    return territory>=55 && Math.random()<0.15;
  }

  return territory>=44 && Math.random()<0.62;
}

function scoreTry(team,state,side){
  state.score[side]+=5; state.tries[side]++;
  state.events.push({minute:state.minute,type:'TRY',team:side,points:5});
  const kick=clamp(0.70+(team.kicking-70)*0.006,0.55,0.91);
  if(chance(kick)){
    state.score[side]+=2; state.conversions[side]++;
    state.events.push({minute:state.minute,type:'CONVERSION',team:side,points:2});
  }else{
    state.events.push({minute:state.minute,type:'CONVERSION_MISS',team:side,points:0});
  }
}

function penaltyShot(team,state,side){
  const kick=clamp(0.72+(team.kicking-70)*0.006,0.55,0.92);
  if(chance(kick)){
    state.score[side]+=3; state.penaltyGoals[side]++;
    state.events.push({minute:state.minute,type:'PENALTY_GOAL',team:side,points:3});
  } else state.events.push({minute:state.minute,type:'PENALTY_MISS',team:side});
}


function logistic(x){return 1/(1+Math.exp(-x))}

function teamOverall(team,state,side){
  return (
    effective(team,state,side,'attack')*0.20+
    effective(team,state,side,'defence')*0.22+
    effective(team,state,side,'scrum')*0.10+
    effective(team,state,side,'lineout')*0.09+
    effective(team,state,side,'kicking')*0.11+
    team.discipline*0.06+
    team.coaching*0.08+
    team.form*0.08+
    team.bench*0.06
  );
}

function liveWinProbability(home,away,state,blockPossessionHome=null,blockTerritoryHome=null){
  const minute=state.minute;
  const remaining=Math.max(1,80-minute);
  const scoreDiff=state.score.home-state.score.away;

  const hp=blockPossessionHome===null
    ? (state.blocks?state.possessionTotal.home/state.blocks:50)
    : blockPossessionHome;
  const ht=blockTerritoryHome===null
    ? (state.blocks?state.territoryTotal.home/state.blocks:50)
    : blockTerritoryHome;

  const hOverall=teamOverall(home,state,'home');
  const aOverall=teamOverall(away,state,'away');
  const strengthEdge=hOverall-aOverall;

  const energyEdge=state.energy.home-state.energy.away;
  const playerEdge=state.players.home-state.players.away;

  // Score becomes increasingly important as time disappears.
  const timePressure=1+(minute/80)*1.9;
  const scoreWeight=scoreDiff*0.105*timePressure;

  // Possession/territory are useful but intentionally secondary to score/time.
  const possessionWeight=(hp-50)*0.020;
  const territoryWeight=(ht-50)*0.028;

  const strengthWeight=strengthEdge*0.040;
  const energyWeight=energyEdge*0.020;
  const playerWeight=playerEdge*0.48;
  const momentumWeight=state.momentum*0.065;
  const homeWeight=state.homeAdvantage*0.065*(remaining/80);

  // Late-game protection for a side that is ahead: every minute without conceding
  // increases the value of the existing lead.
  const clockProtection=scoreDiff===0?0:
    Math.sign(scoreDiff)*(minute/80)*Math.min(Math.abs(scoreDiff),10)*0.018;

  const x=
    scoreWeight+
    possessionWeight+
    territoryWeight+
    strengthWeight+
    energyWeight+
    playerWeight+
    momentumWeight+
    homeWeight+
    clockProtection;

  const homeProb=clamp(logistic(x)*100,1,99);
  return {
    home:+homeProb.toFixed(1),
    away:+(100-homeProb).toFixed(1)
  };
}


function addRugbyFlowEvents(home,away,state,hPoss,hTerr,phases){
  const homeAttacking = hPoss>=50;
  const attackSide = homeAttacking?'home':'away';
  const defendSide = homeAttacking?'away':'home';
  const attackTeam = homeAttacking?home:away;
  const defendTeam = homeAttacking?away:home;
  const attackTerritory = homeAttacking?hTerr:100-hTerr;

  // Knock-ons become a natural source of scrum restarts.
  const fatigue = 100-state.energy[attackSide];
  const handlingPressure = Math.max(0,55-attackTerritory);
  const knockOnChance = clamp(
    0.10 + fatigue*0.0018 + handlingPressure*0.0012 - (attackTeam.attack-70)*0.0015,
    0.055,0.24
  );

  if(chance(knockOnChance)){
    state.events.push({minute:state.minute,type:'KNOCK_ON',team:attackSide});
    state.events.push({minute:state.minute,type:'SCRUM_AWARDED',team:defendSide});

    const atkScrum=effective(attackTeam,state,attackSide,'scrum');
    const defScrum=effective(defendTeam,state,defendSide,'scrum');
    const scrumWinP=clamp(0.50+(defScrum-atkScrum)*0.012,0.28,0.72);
    const winner=chance(scrumWinP)?defendSide:attackSide;
    state.events.push({minute:state.minute,type:'SCRUM_WON',team:winner});
  }

  // Territorial exits / pressure relief.
  if(attackTerritory<42 && chance(0.17)){
    const kickerSide=attackSide;
    state.events.push({minute:state.minute,type:'KICK_TO_TOUCH',team:kickerSide});
    state.events.push({minute:state.minute,type:'PRESSURE_RELIEVED',team:kickerSide});
    state.events.push({minute:state.minute,type:'LINEOUT_AWARDED',team:defendSide});
  }

  // Attacking lineout platform.
  if(attackTerritory>=52 && chance(0.14)){
    state.events.push({minute:state.minute,type:'KICK_TO_TOUCH_ATTACK',team:attackSide});
    state.events.push({minute:state.minute,type:'LINEOUT_AWARDED',team:attackSide});

    const lineoutWinP=clamp(
      0.82 + (effective(attackTeam,state,attackSide,'lineout')-effective(defendTeam,state,defendSide,'lineout'))*0.006,
      0.58,0.94
    );
    if(chance(lineoutWinP)){
      state.events.push({minute:state.minute,type:'LINEOUT_WON',team:attackSide});
    }else{
      state.events.push({minute:state.minute,type:'LINEOUT_STOLEN',team:defendSide});
    }
  }

  // Breakdown turnover during longer phase sequences.
  if(phases>=9 && chance(0.09 + Math.max(0,defendTeam.defence-75)*0.002)){
    state.events.push({minute:state.minute,type:'TURNOVER_WON',team:defendSide});
  }

  // General territorial kicking exchange.
  if(chance(0.11)){
    const kickingSide = hTerr>=50?'away':'home';
    state.events.push({minute:state.minute,type:'CLEARANCE_KICK',team:kickingSide});
  }
}

function simulateBlock(home,away,state){
  resolveSinBins(state);
  applyForcedCards(state);
  applyForcedScoringEvents(state);

  const hPoss=blockPossession(home,away,state);
  const hTerr=blockTerritory(home,away,state,hPoss);
  state.possessionTotal.home+=hPoss; state.possessionTotal.away+=100-hPoss;
  state.territoryTotal.home+=hTerr; state.territoryTotal.away+=100-hTerr;
  state.blocks++;

  const phases=applyWorkload(home,away,state,hPoss,hTerr);
  addRugbyFlowEvents(home,away,state,hPoss,hTerr,phases);

  // Determine which team controls the key attacking opportunity in this block.
  const attackSide=chance(hPoss/100)?'home':'away';
  const defendSide=attackSide==='home'?'away':'home';
  const atk=attackSide==='home'?home:away;
  const def=attackSide==='home'?away:home;
  const territory=attackSide==='home'?hTerr:100-hTerr;

  // Set-piece occurrence. Scrum advantage creates field position/penalty chances.
  if(chance(0.18)){
    const scrum=scrumOutcome(home,away,state,attackSide);
    if(scrum.penalty){
      const pTeam=scrum.penalty==='home'?home:away;
      const pTerr=scrum.penalty==='home'?hTerr:100-hTerr;
      if(strategicPenaltyChoice(state,scrum.penalty,pTerr) && chance(0.88)) penaltyShot(pTeam,state,scrum.penalty);
      state.momentum+=scrum.penalty==='home'?1.2:-1.2;
    }
  }

  // Lineout is another platform, affected by fatigue.
  if(chance(0.16)){
    const atkLO=effective(atk,state,attackSide,'lineout');
    const defLO=effective(def,state,defendSide,'lineout');
    const winP=clamp(0.83+(atkLO-defLO)*0.006,0.60,0.94);
    if(chance(winP)) state.lineoutWins[attackSide]++;
    else {
      state.lineoutLosses[attackSide]++;
      state.events.push({minute:state.minute,type:'LINEOUT_LOST',team:attackSide});
      state.momentum+=attackSide==='home'?-0.8:0.8;
    }
  }

  const atkMod=strategyModifiers(state,attackSide);
  const defMod=strategyModifiers(state,defendSide);
  const atkEff=effective(atk,state,attackSide,'attack')*atkMod.attack;
  const defEff=effective(def,state,defendSide,'defence');
  const playerEdge=state.players[attackSide]-state.players[defendSide];
  const fatigueEdge=state.energy[attackSide]-state.energy[defendSide];

  // Possession + territory generate opportunities; tired/outnumbered defences become vulnerable.
  const tryP=clamp(
    0.105+
    (territory-50)*0.0036+
    (atkEff-defEff)*0.004+
    playerEdge*0.035+
    (atkMod.risk-1)*0.110+
    fatigueEdge*0.0015+
    phases*0.0015,
    0.025,0.42
  );

  // A five-minute block can contain more than one meaningful scoring sequence.
  // Scale opportunity probability to the block duration while retaining state effects.
  const blockTryP=clamp(tryP*1.46*atkMod.tempo,0.025,0.56);
  if(chance(blockTryP)){
    scoreTry(atk,state,attackSide);
    state.momentum+=attackSide==='home'?1.5:-1.5;
  } else {
    const penP=clamp(
      0.115+
      (territory-50)*0.0020+
      (100-def.discipline)*0.0012+
      Math.max(0,-fatigueEdge)*0.0015,
      0.045,0.28
    );
    if(chance(clamp(penP*1.48,0.055,0.36))){
      if(strategicPenaltyChoice(state,attackSide,territory) && chance(0.88)) penaltyShot(atk,state,attackSide);
      state.momentum+=attackSide==='home'?0.6:-0.6;
    }
  }

  maybeCard(home,state,'home',100-hTerr);
  maybeCard(away,state,'away',hTerr);

  // Injuries are uncommon but fatigue raises risk.
  for(const [side,team] of [['home',home],['away',away]]){
    const fatigue=100-state.energy[side];
    if(chance(0.0015+fatigue*0.00012)){
      state.injuries[side]++;
      state.events.push({minute:state.minute,type:'INJURY',team:side});
      state.energy[side]=clamp(state.energy[side]-1.5,20,100);
    }
  }

  const wp=liveWinProbability(home,away,state,hPoss,hTerr);
  state.winProbability.push({
    minute:state.minute,
    home:wp.home,away:wp.away,
    scoreHome:state.score.home,scoreAway:state.score.away,
    possessionHome:+hPoss.toFixed(1),
    territoryHome:+hTerr.toFixed(1),
    energyHome:+state.energy.home.toFixed(1),
    energyAway:+state.energy.away.toFixed(1),
    playersHome:state.players.home,
    playersAway:state.players.away
  });

  // Momentum naturally decays.
  state.momentum*=0.72;
}

function simulateMatch(home,away,options={}){
  const state=initialState(home,away,options);

  // 5-minute stateful blocks.
  for(let minute=5;minute<=80;minute+=5){
    state.minute=minute;
    simulateBlock(home,away,state);
  }

  const possession={
    home:Math.round(state.possessionTotal.home/state.blocks),
    away:0
  };
  possession.away=100-possession.home;

  const territory={
    home:Math.round(state.territoryTotal.home/state.blocks),
    away:0
  };
  territory.away=100-territory.home;

  return {
    home:home.name, away:away.name,
    homeScore:state.score.home, awayScore:state.score.away,
    winner:state.score.home===state.score.away?'Draw':
      state.score.home>state.score.away?home.name:away.name,
    possession, territory,
    energy:{home:+state.energy.home.toFixed(1),away:+state.energy.away.toFixed(1)},
    tackles:state.tackles,
    tackleLoadIndex:{
      home:+((state.tackles.home/15)*(15/state.players.home)).toFixed(1),
      away:+((state.tackles.away/15)*(15/state.players.away)).toFixed(1)
    },
    playersAtFinish:state.players,
    tries:state.tries,
    penaltyGoals:state.penaltyGoals,
    dropGoals:state.dropGoals,
    conversions:state.conversions,
    scrumPenalties:state.scrumPenalties,
    scrumErrors:state.scrumErrors,
    lineoutWins:state.lineoutWins,
    lineoutLosses:state.lineoutLosses,
    cards:state.cards,
    injuries:state.injuries,
    winProbability:state.winProbability,
    timeline:state.events
  };
}

function batchSim(home,away,count=1000,options={}){
  let hw=0,aw=0,d=0,hs=0,as=0,hp=0,ht=0,he=0,ae=0,hTk=0,aTk=0;
  let hY=0,aY=0,hR=0,aR=0,hSP=0,aSP=0,hSE=0,aSE=0,hTry=0,aTry=0,hLoad=0,aLoad=0;
  for(let i=0;i<count;i++){
    const r=simulateMatch(home,away,options);
    hs+=r.homeScore; as+=r.awayScore; hp+=r.possession.home; ht+=r.territory.home;
    he+=r.energy.home; ae+=r.energy.away; hTk+=r.tackles.home; aTk+=r.tackles.away;
    hY+=r.cards.home.yellow;aY+=r.cards.away.yellow;hR+=r.cards.home.red;aR+=r.cards.away.red;
    hSP+=r.scrumPenalties.home;aSP+=r.scrumPenalties.away;hSE+=r.scrumErrors.home;aSE+=r.scrumErrors.away;
    hTry+=r.tries.home;aTry+=r.tries.away;hLoad+=r.tackleLoadIndex.home;aLoad+=r.tackleLoadIndex.away;
    if(r.homeScore>r.awayScore)hw++;else if(r.awayScore>r.homeScore)aw++;else d++;
  }
  return {
    games:count,
    homeWinPct:+(hw/count*100).toFixed(1),awayWinPct:+(aw/count*100).toFixed(1),drawPct:+(d/count*100).toFixed(1),
    avgHomeScore:+(hs/count).toFixed(1),avgAwayScore:+(as/count).toFixed(1),avgTotal:+((hs+as)/count).toFixed(1),
    avgHomePossession:+(hp/count).toFixed(1),avgHomeTerritory:+(ht/count).toFixed(1),
    avgHomeEnergy:+(he/count).toFixed(1),avgAwayEnergy:+(ae/count).toFixed(1),
    avgHomeTackles:+(hTk/count).toFixed(1),avgAwayTackles:+(aTk/count).toFixed(1),
    yellowPerGame:{home:+(hY/count).toFixed(3),away:+(aY/count).toFixed(3)},

    avgTackleLoadIndex:{home:+(hLoad/count).toFixed(1),away:+(aLoad/count).toFixed(1)}
  };

function simulateScriptedPossessionMatch(home,away,script,options={}){
  const state=initialState(home,away,options);

  for(let minute=5;minute<=80;minute+=5){
    state.minute=minute;

    // Force possession by period while preserving the rest of the live engine.
    let forced=null;
    for(const seg of script){
      if(minute>seg.from && minute<=seg.to)forced=seg.homePossession;
    }
    state.forcedPossessionHome=forced;
    simulateBlock(home,away,state);
  }

  return {
    home:home.name,away:away.name,
    homeScore:state.score.home,awayScore:state.score.away,
    energy:{home:+state.energy.home.toFixed(1),away:+state.energy.away.toFixed(1)},
    tackles:state.tackles,
    winProbability:state.winProbability,
    timeline:state.events
  };
}


function simulateFromState(home,away,startState,script=[],options={}){
  const state=initialState(home,away,options);

  state.minute=startState.minute??40;
  state.score.home=startState.scoreHome??13;
  state.score.away=startState.scoreAway??10;
  state.energy.home=startState.energyHome??84;
  state.energy.away=startState.energyAway??80;
  state.tackles.home=startState.tacklesHome??70;
  state.tackles.away=startState.tacklesAway??95;
  state.players.home=startState.playersHome??15;
  state.players.away=startState.playersAway??15;

  // Seed first-half aggregate possession/territory so live WP knows what preceded HT.
  state.blocks=8;
  state.possessionTotal.home=(startState.firstHalfPossessionHome??60)*8;
  state.possessionTotal.away=(100-(startState.firstHalfPossessionHome??60))*8;
  state.territoryTotal.home=(startState.firstHalfTerritoryHome??54)*8;
  state.territoryTotal.away=(100-(startState.firstHalfTerritoryHome??54))*8;

  state.winProbability.push({
    minute:state.minute,
    ...liveWinProbability(home,away,state,startState.firstHalfPossessionHome??60,startState.firstHalfTerritoryHome??54),
    scoreHome:state.score.home,scoreAway:state.score.away,
    possessionHome:startState.firstHalfPossessionHome??60,
    territoryHome:startState.firstHalfTerritoryHome??54,
    energyHome:state.energy.home,energyAway:state.energy.away,
    playersHome:state.players.home,playersAway:state.players.away
  });

  for(let minute=45;minute<=80;minute+=5){
    state.minute=minute;
    let forced=null;
    for(const seg of script){
      if(minute>seg.from && minute<=seg.to)forced=seg.homePossession;
    }
    state.forcedPossessionHome=forced;
    simulateBlock(home,away,state);
  }

  return {
    home:home.name,away:away.name,
    homeScore:state.score.home,awayScore:state.score.away,
    energy:{home:+state.energy.home.toFixed(1),away:+state.energy.away.toFixed(1)},
    tackles:state.tackles,
    winProbability:state.winProbability,
    timeline:state.events
  };
}

return {DEFAULT_PROFILE,teamProfile,simulateMatch,batchSim,simulateScriptedPossessionMatch,simulateFromState,liveWinProbability};

function genericPlayerPool(team){
 const first=['Jack','Tom','Ben','Sam','Will','Harry','Max','Joe','Dan','Alex','Josh','Finn','Luke','Theo','Owen'];
 const last=['Carter','Morgan','Davies','Walker','Evans','Turner','Reed','Bennett','Hughes','Parker','Morris','Cooper','Foster','Hayes','Cole'];
 const roles=['prop','hooker','prop','lock','lock','backrow','backrow','backrow','scrumhalf','flyhalf','backthree','centre','centre','backthree','backthree'];
 let seed=[...team].reduce((a,c)=>a+c.charCodeAt(0),0);
 return roles.map((role,i)=>({name:first[(seed+i*3)%first.length]+' '+last[(seed+i*5+2)%last.length],role}));
}
function matchPlayer(team,type,minute){
 const pool=INTERNATIONAL_PLAYER_POOLS[team]||genericPlayerPool(team);
 let roles=['backrow','centre','backthree'];
 if(type==='TRY')roles=['backthree','centre','backrow','flyhalf'];
 else if(['CONVERSION','CONVERSION_MISS','PENALTY_GOAL','PENALTY_MISS','DROP_GOAL'].includes(type))roles=['flyhalf','backthree'];
 else if(type.includes('SCRUM'))roles=['prop','hooker'];
 else if(type.includes('LINEOUT'))roles=['lock','hooker','backrow'];
 else if(type==='TURNOVER_WON')roles=['backrow','lock'];
 else if(type==='KNOCK_ON')roles=['backthree','centre','backrow','lock','flyhalf'];
 else if(type.includes('KICK')||type==='PRESSURE_RELIEVED')roles=['flyhalf','scrumhalf','backthree'];
 const list=pool.filter(x=>roles.includes(x.role));
 const candidates=list.length?list:pool;
 const seed=(minute||0)*17+[...type+team].reduce((a,c)=>a+c.charCodeAt(0),0);
 return candidates[seed%candidates.length];
}

function runningScoreAtMinute(sim,minute){

}


function liveStatsAtMinute(sim,minute){
 const entries=(sim.winProbability||[]).filter(x=>x.minute<=minute);

 let possessionHome=50;
 let territoryHome=50;

 if(entries.length){
  possessionHome=entries.reduce((sum,x)=>sum+(Number(x.possessionHome)||50),0)/entries.length;
  territoryHome=entries.reduce((sum,x)=>sum+(Number(x.territoryHome)||50),0)/entries.length;
 }

 let triesHome=0,triesAway=0;
 for(const ev of sim.timeline||[]){
  if(ev.minute>minute)continue;
  if(ev.type!=='TRY' && ev.type!=='TRY_FORCED')continue;
  if(ev.team==='home')triesHome++;
  else if(ev.team==='away')triesAway++;
 }

 return {
  possessionHome:Math.round(possessionHome),
  territoryHome:Math.round(territoryHome),
  triesHome,
  triesAway
 };
}

function conditionFunding(area){
 let p=S.programmes?.[area.id];
 if(!p)return 0;
 // Existing programme model stores annual funding in £m.
 return Number(p.funding??p.annualFunding??0)||0;
}
function conditionTrend(area){
 ensureConditionEventState();
 let now=area.value();
 let last=P2.conditionEvents.lastValue[area.id];
 if(last===undefined)return 0;
 return now-last;
}
function conditionSeverity(area){
 let v=area.value();
 let trend=conditionTrend(area);
 let funding=conditionFunding(area);

 // Healthy or clearly improving systems should not create pressure events.
 if(v>=75)return 'healthy';
 if(trend>=1.5 && v>=50)return 'improving';

 // Watch band: only warning territory when actually falling.
 if(v>=60){
   if(trend<=-1.5)return 'warning';
   return 'stable';
 }

 // 50-59: concern, but still normally warning rather than intervention
 // if meaningful funding is already committed or the trend is flat/improving.
 if(v>=50){
   if(trend>=0)return 'warning';
   if(funding>=2.5 && trend>-2.5)return 'warning';
   return 'poor';
 }

 // 45-49: intervention only when decline is real; strong investment can soften it to warning.
 if(v>=45){
   if(funding>=3 && trend>=-1)return 'warning';
   return trend<0?'poor':'warning';
 }

 // Below 45 is genuinely critical, especially if still deteriorating.
 return 'critical';
}

function conditionBand(v){
 if(v>=75)return 'healthy';
 if(v>=60)return 'watch';
 if(v>=45)return 'poor';
 return 'critical';
}
function daysSince(date){
 if(!date)return 9999;
 return Math.floor((new Date(S.date+'T12:00:00')-new Date(date+'T12:00:00'))/86400000);
}
function areaChange(area){
 ensureConditionEventState();
 let now=area.value(),last=P2.conditionEvents.lastValue[area.id];
 let change=last===undefined?0:now-last;
 P2.conditionEvents.lastValue[area.id]=now;
 return change;
}
function conditionArticleEligible(area,change){
 let sev=conditionSeverity(area);
 let funding=conditionFunding(area);

 if((sev==='healthy'||sev==='improving') && change>=1 && daysSince(P2.conditionEvents.lastArticle[area.id])>=120)
   return 'positive';

 if(sev==='warning' && change<0 && daysSince(P2.conditionEvents.lastWarning[area.id])>=120)
   return 'warning';

 // If a programme is in the watch range with substantial existing funding,
 // allow a softer monitoring article rather than a demand for action.
 if(area.value()>=50 && area.value()<60 && funding>=2.5 && daysSince(P2.conditionEvents.lastWarning[area.id])>=150)
   return 'warning';

 return null;
}
function conditionInterventionEligible(area){
 let sev=conditionSeverity(area);
 if(!['poor','critical'].includes(sev))return false;
 if(daysSince(P2.conditionEvents.lastIntervention[area.id])<180)return false;
 return true;
}
function showConditionArticle(area,type){
 let funding=conditionFunding(area),trend=conditionTrend(area);
 let title=type==='positive'?area.positiveTitle:area.warningTitle;
 let body=type==='positive'?area.positiveBody:area.warningBody;
 let source=type==='positive'?'RFU Rugby Report':'Rugby Media';

 if(type==='warning' && funding>0){
   body+=` The RFU is already committing £${funding.toFixed(1)}m annually to this area, so attention is now focused on whether that investment can reverse the recent trend.`;
 }
 if(type==='positive' && funding>0){
   body+=` Current RFU funding of £${funding.toFixed(1)}m a year is being credited as part of the improvement.`;
 }

 let story={date:S.date,title,body,source,kind:type==='positive'?'positive_news':'warning_news'};
 S.inbox.unshift(story);
 P2.mediaHistory.unshift(story);

 if(type==='positive')P2.conditionEvents.lastArticle[area.id]=S.date;
 else P2.conditionEvents.lastWarning[area.id]=S.date;

 p2Save();save();
 showModal(`<div class="small muted" style="text-transform:uppercase;letter-spacing:.08em">${source} · ${type==='positive'?'Update':'Warning'}</div>
 <h2>${title}</h2><p>${body}</p>
 <button class="btn primary" id="conditionArticleContinue">Continue</button>`);
 document.getElementById('conditionArticleContinue').onclick=()=>{closeModal();render()};
}
function conditionInterventionEvent(area){
 let v=area.value();
 let sev=conditionSeverity(area);
 let critical=sev==='critical';
 let funding=conditionFunding(area);

 let body=area.interventionBody;
 if(funding>0){
   body+=` The RFU is already spending £${funding.toFixed(1)}m annually in this area, but current indicators suggest that further action or a change of approach may be required.`;
 }

 return {
   id:'condition_'+area.id+'_'+S.date,
   topic:area.topic,
   kind:'stakeholder',
   source:area.id==='referees'?'RFU Match Officials Department':
          area.id==='grassroots'?'Community Rugby Council':
          area.id==='schools'?'Schools Rugby Network':
          area.id==='women'?"Women's Rugby Council":
          'Professional Rugby Pathway',
   title:area.interventionTitle,
   body,
   forced:true,
   conditionArea:area.id,
   conditionCritical:critical
 };
}
function applyConditionOutcome(event,analysis){
 if(!event.conditionArea)return;
 let area=conditionAreas().find(a=>a.id===event.conditionArea);
 if(!area)return;

 let good=analysis.grade==='strong'||analysis.grade==='adequate';
 let critical=event.conditionCritical;

 // Asymmetric consequences: failure hurts far more than success helps.
 let rels={};
 rels[area.relationship]=good?(critical?2:1):(critical?-8:-5);
 adjustRelations(rels);

 if(good){
   let p=S.programmes[area.id];
   if(p&&typeof p.score==='number')p.score=clamp(p.score+(critical?2:1));
   P2.conditionEvents.outcomes.push({
     due:addDays(S.date,120),area:area.id,type:'positive',
     title:`${area.label} response begins to show results`,
     body:`The RFU response to earlier pressure around ${area.label.toLowerCase()} is beginning to produce measurable improvement.`
   });
 }else{
   let p=S.programmes[area.id];
   if(p&&typeof p.score==='number')p.score=clamp(p.score-(critical?4:2));
   P2.conditionEvents.outcomes.push({
     due:addDays(S.date,90),area:area.id,type:'negative',
     title:`Pressure grows around ${area.label.toLowerCase()}`,
     body:`The earlier RFU response has failed to halt the decline, and stakeholders are reporting worsening conditions.`
   });
 }
 P2.conditionEvents.lastIntervention[area.id]=S.date;
}
function processConditionOutcomes(){
 ensureConditionEventState();
 let due=P2.conditionEvents.outcomes.filter(x=>x.due<=S.date);
 if(!due.length)return false;
 let o=due[0];
 P2.conditionEvents.outcomes=P2.conditionEvents.outcomes.filter(x=>x!==o);

 let story={date:S.date,title:o.title,body:o.body,source:'Rugby Media',kind:'outcome_news'};
 S.inbox.unshift(story);P2.mediaHistory.unshift(story);
 p2Save();save();

 showModal(`<div class="small muted" style="text-transform:uppercase;letter-spacing:.08em">Rugby Media · Outcome</div>
 <h2>${o.title}</h2><p>${o.body}</p>
 <button class="btn primary" id="conditionOutcomeContinue">Continue</button>`);
 document.getElementById('conditionOutcomeContinue').onclick=()=>{closeModal();render()};
 return true;
}
function conditionLedEventCheck(){
 ensureConditionEventState();

 if(processConditionOutcomes())return true;

 let areas=conditionAreas();
 let changes=areas.map(a=>({area:a,change:areaChange(a)}));

 // Critical/poor intervention takes priority.
 let interventions=changes.filter(x=>conditionInterventionEligible(x.area));
 if(interventions.length){
   interventions.sort((a,b)=>a.area.value()-b.area.value());
   let chosen=interventions[0].area;
   P2.conditionEvents.lastIntervention[chosen.id]=S.date;
   openLifecycleEvent(conditionInterventionEvent(chosen));
   return true;
 }

 // Otherwise occasional informational article only.
 for(let x of changes){
   let type=conditionArticleEligible(x.area,x.change);
   if(type){
     showConditionArticle(x.area,type);
     return true;
   }
 }
 return false;
}

function detectPosition(e,clean){
 const clubTopic=(e.id==='club_finance_warning'||e.id==='prem_release'||e.topic==='club_country'||e.topic==='club_finance');
 if(clubTopic){
   let remit=/\b(private|privately run|private company|private companies|business|businesses|commercial organisation|commercial organisations|not the rfu'?s responsibility|outside the rfu'?s remit|rfu remit|rfu responsibility)\b/.test(clean);
   let national=/\b(player|players|england|national team|country|international programme|international players)\b/.test(clean);
   let refuse=/\b(no additional funding|should fund themselves|self fund|self-fund|not subsidise|should not subsidise|won't fund|will not fund|not our responsibility)\b/.test(clean);
   let support=/\b(increase funding|more funding|support clubs|financial support|help clubs|stability payment|central support)\b/.test(clean);
   let negotiate=/\b(talks|negotiate|discussion|agreement|partnership|compromise)\b/.test(clean);

   if((remit&&national)||refuse)return 'rfu_remit_hardline';
   if(support)return 'club_supportive';
   if(negotiate)return 'club_compromise';
  }
 return 'general';
}
function positionEffects(position){
 if(position==='rfu_remit_hardline')return {clubs:-6,board:3,media:-1,players:1};
 if(position==='club_supportive')return {clubs:5,board:-2};
 if(position==='club_compromise')return {clubs:3,board:1,media:1};
 return {};
}

function analyseResponse(e,text,tone){
 let c=normResp(text),p=profileFor(e),words=c.split(' ').filter(Boolean);
 let req=p.required.filter(g=>anyResp(c,g)).length,use=p.useful.filter(g=>anyResp(c,g)).length;
 let rel=req/Math.max(1,p.required.length),coverage=Math.min(1,(req*2+use)/(p.required.length*2+Math.max(1,p.useful.length)*.6));
 let position=detectPosition(e,c);

 // A clearly argued opposing position still answers the question.
 // Do not confuse disagreement with irrelevance.
 if(position==='rfu_remit_hardline'){
   rel=Math.max(rel,.78);
   coverage=Math.max(coverage,.68);
 }
 // Positive England-performance questions accept credible causal explanations
 // such as coaching, investment, grassroots and pathway development.
 if((e.id==='england_success_dynamic'||e.topic==='england_performance_positive') && use>=2){
   rel=Math.max(rel,.72);
   coverage=Math.max(coverage,.72);
 }

function parseMoneyAmount(text){

   /£\s*(\d+(?:\.\d+)?)\s*(million|m)\b/,

   /(\d+(?:\.\d+)?)\s*(million|m)\s*(?:pounds|quid)?\b/,
   /(\d+(?:\.\d+)?)\s*(thousand|k)\s*(?:pounds|quid)?\b/,
   /£\s*(\d+(?:\.\d+)?)\b/

 for(const p of patterns){
   const m=c.match(p);
   if(!m)continue;
   let n=parseFloat(m[1]),unit=(m[2]||'').toLowerCase();

function eventTitle(event){
 if(Array.isArray(event.titleVariants)&&event.titleVariants.length)return event.titleVariants[(P2.eventCounter||0)%event.titleVariants.length];
 return typeof event.title==='function'?event.title():event.title;
}
function eventBody(event){
 if(Array.isArray(event.bodyVariants)&&event.bodyVariants.length){
   let b=event.bodyVariants[(P2.eventCounter||0)%event.bodyVariants.length];
   return typeof b==='function'?b():b;
 }
 return typeof event.body==='function'?event.body():event.body;
}
function eventTopic(event){return event.topic||event.id}

function discretionarySeasonTarget(){
 const key=seasonKey();
 if(!P2.seasonEventTarget[key]){
   // Stable per-season target between 3 and 5.
   let seed=key.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
   P2.seasonEventTarget[key]=3+(seed%3);
   p2Save();
 }
 return P2.seasonEventTarget[key];
}
function discretionarySeasonCount(){
 return P2.seasonEventCounts[seasonKey()+':TOTAL']||0;
}
function eventIsMajorOrForced(event){
 return !!event.commitmentRef || event.kind==='major' || event.kind==='crisis' || event.forced===true;
}
function topicSeasonCount(event){
 return P2.topicSeasonCounts[seasonKey()+':'+eventTopic(event)]||0;
}

function seasonKey(){return S.date.slice(0,4)}

function eligibleLifecycleEvents(){
 let c=lifecycleContext(),now=new Date(S.date+'T12:00:00');
 let list=LIFECYCLE_EVENTS.filter(e=>{try{return e.when(c)}catch(err){return false}});

 return list.filter(e=>{
   if(activeCommitmentForEvent(e))return false;

   // Exact event: effectively once per season unless circumstances are exceptional.
   let last=P2.eventLastSeen?.[e.id];
   if(last && ((now-new Date(last+'T12:00:00'))/86400000)<330)return false;

   // Topic/family: long cooldown.
   let t=eventTopic(e),lt=P2.topicLastSeen?.[t];
   if(lt && ((now-new Date(lt+'T12:00:00'))/86400000)<240)return false;

   // Ordinary topics appear at most once per season.
   if(topicSeasonCount(e)>=1)return false;

   // Avoid same source repeatedly.
   let recent=(P2.lastSources||[]).slice(-2);
   if(recent.length===2 && recent.every(x=>x===e.source))return false;

   return true;
 });
}
function weightedLifecyclePick(list){
 let total=list.reduce((a,e)=>a+(e.weight||1),0),r=Math.random()*total;
 for(let e of list){r-=e.weight||1;if(r<=0)return e}
 return list[0];
}

function scheduleDelayedConsequence(item){
 if(!item)return;
 let months=item.months||6;
 let due=new Date(S.date+'T12:00:00');
 due.setMonth(due.getMonth()+months);
 P2.delayedConsequences.push({
   due:due.toISOString().slice(0,10),
   source:item.source||'RFU decision',
   title:item.title||'Long-term consequence',
   kind:item.kind||'system',
   effects:item.effects||{},
   story:item.story||'A previous RFU decision has produced a longer-term consequence.'
 });
 p2Save();
}
function applySystemEffects(effects){
 if(!effects)return;
 if(effects.registeredPlayers)S.participation.registered=Math.max(100000,Math.round(S.participation.registered*(1+effects.registeredPlayers)));
 if(effects.youthPlayers)S.participation.youth=Math.max(50000,Math.round(S.participation.youth*(1+effects.youthPlayers)));
 if(effects.grassroots)S.programmes.grassroots.score=clamp(S.programmes.grassroots.score+effects.grassroots);
 if(effects.schools)S.programmes.schools.score=clamp(S.programmes.schools.score+effects.schools);
 if(effects.academies)S.programmes.academies.score=clamp(S.programmes.academies.score+effects.academies);
 if(effects.coaches)S.programmes.coaches.score=clamp(S.programmes.coaches.score+effects.coaches);
 if(effects.referees)S.programmes.referees.score=clamp(S.programmes.referees.score+effects.referees);
 if(effects.u20)S.programmes.u20.score=clamp(S.programmes.u20.score+effects.u20);
 if(effects.elite)S.programmes.elite.score=clamp(S.programmes.elite.score+effects.elite);
 if(effects.cash){S.balance+=effects.cash;S.financeLog.unshift({date:S.date,delta:effects.cash,why:'Delayed RFU consequence'})}
 if(effects.rels)adjustRelations(effects.rels);
 if(effects.temp)addTemporaryEffect(effects.temp);
}
function processDelayedConsequences(){
 let due=P2.delayedConsequences.filter(x=>x.due<=S.date);
 if(!due.length)return;
 P2.delayedConsequences=P2.delayedConsequences.filter(x=>x.due>S.date);
 due.forEach(x=>{
   applySystemEffects(x.effects);
   let story={date:S.date,title:x.title,body:x.story,source:x.source,kind:x.kind};
   S.inbox.unshift(story);
   P2.mediaHistory.unshift(story);
   P2.systemHistory.unshift(story);
 });
 p2Save();save();
}

 if(c.amount)return c.amount;
 let parsed=parseMoneyAmount(c.summary||'');
 return parsed||0;
}
function formatCommitmentAmount(amount){
 if(!amount)return 'No fixed amount recorded';
 if(amount>=1e6)return `£${(amount/1e6).toFixed(amount%1e6?1:0)}m`;
 return `£${Math.round(amount/1000)}k`;
}

 }[c.family]||c.topic||'RFU commitment';
}

 return (P2.commitments||[]).filter(c=>!c.checked && c.due<=S.date);
}
function commitmentFollowupEvent(commitment){
 return {
   id:'commitment_due_'+commitment.family+'_'+commitment.date,
   topic:commitment.topic||commitment.family,
   kind:'commitment_decision',
   source:commitment.family==='referee_support'?'RFU Match Officials Department':
          commitment.family==='premiership_funding'?'Premiership Rugby':

          'RFU Stakeholders',
   title:`${commitmentAreaLabel(commitment)} commitment is now due`,
   body:`The RFU previously said this issue would be revisited ${commitment.timingLabel||'at this point'}.`,
   commitmentRef:commitment,
   forced:true
 };
}

function lifecycleEventCheck(){
 // Timed commitments still take priority.
 let due=dueCommitments();
 if(due.length){
   openLifecycleEvent(commitmentFollowupEvent(due[0]));
   return;
 }

 // Simulation conditions decide whether something meaningful is happening.
 if(conditionLedEventCheck())return;

 P2.weeksSinceLifecycleEvent=(P2.weeksSinceLifecycleEvent||0)+1;

 // Generic media/stakeholder events are now rare background colour only.
 // The condition-led engine is the primary source of management pressure.
 let count=discretionarySeasonCount();
 let target=Math.min(2,discretionarySeasonTarget());
 if(count>=target){p2Save();return}

 if(P2.weeksSinceLifecycleEvent<14){p2Save();return}

 // Only a very small chance for a general non-condition-specific story.
 let chance=.012+Math.min(.018,(P2.weeksSinceLifecycleEvent-14)*.002);
 if(Math.random()>chance){p2Save();return}

function applyCommitmentInvestment(c,amount){

 S.financeLog.unshift({date:S.date,delta:-amountGame,why:`Honoured commitment: ${commitmentAreaLabel(c)}`});

 if(area==='referee_support'){
   if(S.programmes.referees)S.programmes.referees.score=clamp(S.programmes.referees.score+.35*Math.min(3,amount/1e6));
   adjustRelations({community:3,media:1,board:-1});
   scheduleDelayedConsequence({
     months:9,source:'RFU Match Officials Department',

   });
 }else if(area==='premiership_funding'){

     months:12,source:'Community Rugby',
     title:'Community support commitment begins to show results',kind:'community',

function resolveCommitmentDecision(event,choiceId,value){
 let c=event.commitmentRef;
 let base=commitmentAmount(c)||500000;

 if(['honour','increase','reduce'].includes(choiceId)){
   let amount=choiceId==='honour'?base:value;
   if(!applyCommitmentInvestment(c,amount)){
     alert('The RFU does not currently have enough cash to honour that amount.');
     return;
   }

   c.checked=true;

   if(choiceId==='increase')adjustRelations({media:2,board:-1});
   else if(choiceId==='reduce')adjustRelations({media:-2,board:1});
   else adjustRelations({media:1,board:1});

   let title=
     choiceId==='increase'?`${commitmentAreaLabel(c)} commitment increased`:
     choiceId==='reduce'?`${commitmentAreaLabel(c)} commitment reduced`:
     `${commitmentAreaLabel(c)} commitment honoured`;

   let body=
     choiceId==='increase'
       ?`The RFU has gone beyond its original promise and approved ${formatCommitmentAmount(amount)}. Stakeholders have welcomed the additional commitment, although the larger cost will be felt elsewhere in the budget.`
       :choiceId==='reduce'
         ?`The RFU has approved ${formatCommitmentAmount(amount)}, below the amount previously discussed. The decision closes the immediate commitment but is likely to disappoint those expecting the original level of support.`
         :`The RFU has approved the previously promised ${formatCommitmentAmount(amount)}, formally closing the commitment.`;

   let story={date:S.date,title,body,source:event.source,kind:'commitment'};
   S.inbox.unshift(story);P2.mediaHistory.unshift(story);
 }
 else if(choiceId==='delay'){
   let months=Math.max(1,Math.min(6,Math.round(value||1)));
   let delayDays=months===1?30:months===3?90:180;
   c.due=addDays(S.date,delayDays);
   c.timingLabel=`in ${months} month${months===1?'':'s'}`;

   let severity=months===6?3:months===3?2:1;
   let rels={media:-severity,board:-Math.max(1,severity-1)};
   if(c.family==='premiership_funding')rels.clubs=-severity;
   if(c.family==='community_support'||c.family==='referee_support')rels.community=-severity;
   adjustRelations(rels);

   let story={
     date:S.date,
     title:`RFU delays ${commitmentAreaLabel(c).toLowerCase()} decision`,
     body:`The RFU has pushed the promised decision back by ${months} month${months===1?'':'s'}. Stakeholders have been told the issue will return at the new deadline.`,
     source:event.source,kind:'commitment'
   };
   S.inbox.unshift(story);P2.mediaHistory.unshift(story);
 }
 else if(choiceId==='withdraw'){
   c.checked=true;
   let rels={media:-5,board:-3};
   if(c.family==='premiership_funding')rels.clubs=-8;
   if(c.family==='community_support'||c.family==='referee_support')rels.community=-8;
   adjustRelations(rels);

   let story={
     date:S.date,
     title:`RFU withdraws ${commitmentAreaLabel(c).toLowerCase()} commitment`,
     body:`The RFU has formally withdrawn the commitment it previously made. The decision avoids the immediate cost but has triggered a sharp negative reaction from the stakeholders who had been expecting action.`,
     source:event.source,kind:'commitment'
   };
   S.inbox.unshift(story);P2.mediaHistory.unshift(story);
 }

 P2.weeksSinceLifecycleEvent=0;
 p2Save();save();
 closeModal();render();
}

function mediaToneFromChoice(choice){
 let rels=choice.rels||{}, mediaDelta=rels.media||0, boardDelta=rels.board||0, fanDelta=rels.fans||0, playerDelta=rels.players||0, clubDelta=rels.clubs||0;
 let score=mediaDelta*2+boardDelta*.5+fanDelta*.35+playerDelta*.2+clubDelta*.15;
 // Existing media standing shapes how the same answer is framed.
 score += (S.relationships.media-50)*.06;
 if(score>=5) return 'supportive';
 if(score>=1.5) return 'positive';
 if(score<=-5) return 'hostile';
 if(score<=-1.5) return 'critical';
 return 'neutral';
}
function articleDeck(event,choice,tone){
 const response=choice.text.toLowerCase();
 const outlet=event.source||'Rugby media';
 const subject=typeof event.title==='function'?event.title():event.title;
 const form=recentEnglandForm();
 let context='';

 if((/recent form|england|programme|six nations/i.test(subject)) && form.played){
   let latest=form.latest;
   if(latest)context=` England's latest result was a ${latest.eng>latest.opp?'win':'defeat'} against ${latest.opponent}, ${latest.eng}–${latest.opp}.`;
 }

 const framing={
   supportive:[
     `The RFU's response has been received as a show of confidence rather than panic.`,
     `There is a sense that Twickenham is prepared to hold its nerve rather than react to the loudest voices around the game.`,
     `The message from the RFU was clear: the current plan still has the backing of those at the top.`
   ],
   positive:[
     `The response has taken some heat out of the issue, although expectations will now rise around what happens next.`,
     `The RFU has chosen a measured line, attempting to reassure stakeholders without pretending the problem has disappeared.`,
     `For now, the governing body has bought itself some breathing space — but that goodwill will depend on follow-through.`
   ],
   neutral:[
     `The statement answered the immediate question without closing down the wider debate.`,
     `There was little drama in the RFU's response, but equally little to suggest the issue is finished.`,
     `Attention will now move quickly from words to what the RFU actually does next.`
   ],
   critical:[
     `The response has done little to silence criticism and may instead sharpen questions about the RFU's judgement.`,
     `Rather than settling the issue, the comments have given critics fresh material and increased pressure on the governing body.`,
     `The RFU may have intended to draw a line under the story, but the reaction suggests the opposite has happened.`
   ],
   hostile:[
     `The response has landed badly and is already being portrayed as another sign of an RFU leadership out of touch with the mood around the game.`,
     `Criticism intensified almost immediately, with the governing body accused of failing to grasp the seriousness of the situation.`,
     `What was meant to be a defence of the RFU position has instead poured fuel on an already uncomfortable story.`
   ]
 };

 let options=framing[tone]||framing.neutral;
 let opening=options[Math.floor(Math.random()*options.length)];
 let consequence='';

 if(/back|support|faith/.test(response)){
   consequence=`That loyalty will be welcomed inside the England environment, but it also ties RFU leadership more closely to the next set of results.`;
 }else if(/improve|must improve|demand/.test(response)){
   consequence=`The intervention places clear public pressure on coaches and players; improvement will now be expected immediately.`;
 }else if(/review|independent|internal/.test(response)){
   consequence=`The review gives the RFU a process to point to, but guarantees the issue stays in the headlines until conclusions are published.`;
 }else if(/decline|no comment|refuse/.test(response)){
   consequence=`By refusing to engage further, the RFU has left a vacuum that reporters, former players and supporters are likely to fill themselves.`;
 }else if(/acknowledge|concerns|ongoing|talks/.test(response)){
   consequence=`The softer tone should ease some immediate tension, although stakeholders will now expect evidence that those talks lead somewhere.`;
 }else if(choice.cash<0){
   consequence=`The financial commitment makes the response tangible, but the RFU will be judged on whether the money produces visible results.`;
 }else if(choice.cash>0){
   consequence=`The arrangement strengthens the commercial position, though supporters will judge it by what it ultimately delivers for rugby.`;
 }else{
   consequence=`The response has shifted the mood around the issue, but its real significance will depend on what follows over the coming weeks.`;
 }

 return `${opening}${context} ${consequence}`;
}
function articleHeadline(event,choice,tone){
 const base=choice.headline||event.title;
 if(tone==='hostile'){
   if(/backs|backing/i.test(base))return base.replace(/backs|backing/i,'doubles down on');
   if(/declines|decline/i.test(base))return base+' as pressure mounts';
   return `Pressure mounts: ${base}`;
 }
 if(tone==='critical'){
   if(/backs|backing/i.test(base))return base+' despite growing criticism';
   return base+' as questions remain';
 }
 if(tone==='supportive'){
   if(/backs|backing/i.test(base))return base.replace(/backs/i,'stands behind');
   return base;
 }
 return base;
}

 return {title:`${source} ${direction} RFU response`,body:detail};
}

function resolveLifecycleEvent(event,i){
 let c=event.choices[i];if(!c)return;
 if(event.commitmentRef){
   // Delaying again creates a new near-term deadline; otherwise the original commitment is closed.
   if(/delay|push/i.test(c.text)){
     event.commitmentRef.due=addDays(S.date,42);
     event.commitmentRef.timingLabel='in six weeks';
   }else{
     event.commitmentRef.checked=true;
   }
 }event.title=event._renderedTitle||eventTitle(event);event.body=event._renderedBody||eventBody(event);event.source=event._renderedSource||event.source;
 S.balance+=c.cash||0;
 if(c.cash)S.financeLog.unshift({date:S.date,delta:c.cash,why:event.title});
 adjustRelations(c.rels||{});addTemporaryEffect(c.temp);if(c.delay)scheduleDelayedConsequence(c.delay);

 // Generate narrative reaction before storing the story.
 let narrative;
 if(event.kind==='media'){
   let tone=mediaToneFromChoice(c);

 }

 let story={
   date:S.date,

 };

 P2.recentTopics.push(event.id);P2.recentTopics=P2.recentTopics.slice(-12);P2.eventLastSeen[event.id]=S.date;
 P2.topicLastSeen[eventTopic(event)]=S.date;
 P2.lastSources.push(event.source);P2.lastSources=P2.lastSources.slice(-6);
 let familyKey=seasonKey()+':'+eventTopic(event);P2.seasonEventCounts[familyKey]=(P2.seasonEventCounts[familyKey]||0)+1;
 if(!eventIsMajorOrForced(event)){
   let totalKey=seasonKey()+':TOTAL';
   P2.seasonEventCounts[totalKey]=(P2.seasonEventCounts[totalKey]||0)+1;
   let topicKey=seasonKey()+':'+eventTopic(event);
   P2.topicSeasonCounts[topicKey]=(P2.topicSeasonCounts[topicKey]||0)+1;
 }
 P2.weeksSinceLifecycleEvent=0;
 P2.activeIssue=null;
 p2Save();save();

 // Do not disappear back to the game immediately: show the resulting article/response first.
 showPostDecisionFeedback(event,c);
}

<script id="v18-development-network-engine">
/* RFU Director V1.8.1 — English Rugby Development Network calibration */
(function(){
const V18_REGIONS=[
 {id:"north_east",name:"North East",supportNeed:.90,base:{participation:46,facilities:48,coaching:50,pathway:45,potential:68}},
 {id:"north_west",name:"North West",supportNeed:1.20,base:{participation:60,facilities:57,coaching:59,pathway:58,potential:72}},
 {id:"yorkshire",name:"Yorkshire",supportNeed:1.25,base:{participation:66,facilities:59,coaching:63,pathway:64,potential:78}},
 {id:"east_midlands",name:"East Midlands",supportNeed:1.15,base:{participation:69,facilities:64,coaching:67,pathway:69,potential:76}},
 {id:"west_midlands",name:"West Midlands",supportNeed:1.05,base:{participation:55,facilities:54,coaching:57,pathway:53,potential:73}},
 {id:"east",name:"East",supportNeed:1.00,base:{participation:51,facilities:58,coaching:55,pathway:52,potential:75}},
 {id:"london",name:"London",supportNeed:1.50,base:{participation:61,facilities:49,coaching:65,pathway:66,potential:92}},
 {id:"south_east",name:"South East",supportNeed:1.30,base:{participation:59,facilities:58,coaching:61,pathway:60,potential:82}},
 {id:"south_central",name:"South Central",supportNeed:1.10,base:{participation:62,facilities:62,coaching:63,pathway:62,potential:79}},
 {id:"south_west",name:"South West",supportNeed:1.25,base:{participation:78,facilities:64,coaching:72,pathway:73,potential:84}}
];

const V18_PROJECT_TYPES={
 facilities:{name:"Community Facilities Programme",capital:6.0,annual:.45,delivery:2,peak:4,decay:.82,legacy:.12,effects:{facilities:13,participation:4}},
 schools:{name:"Schools Rugby Programme",capital:1.8,annual:.75,delivery:1,peak:4,decay:.70,legacy:.06,effects:{participation:10,coaching:3}},
 coaching:{name:"Regional Coaching Network",capital:1.0,annual:.90,delivery:1,peak:3,decay:.62,legacy:.05,effects:{coaching:12,pathway:4}},
 development_centre:{name:"Regional Development Centre",capital:7.5,annual:.80,delivery:2,peak:5,decay:.84,legacy:.14,effects:{facilities:7,pathway:13,coaching:4}},
 talent:{name:"Talent Identification Network",capital:.8,annual:.70,delivery:1,peak:3,decay:.58,legacy:.03,effects:{pathway:10}},
 academy_support:{name:"Academy Partnership Programme",capital:1.5,annual:1.0,delivery:1,peak:4,decay:.67,legacy:.05,effects:{pathway:9,coaching:3}}
};

function clamp(v,a=0,b=100){return Math.max(a,Math.min(b,v))}
function qualityLabel(v){return v>=78?"Strong":v>=65?"Stable":v>=50?"Under pressure":v>=35?"Weak":"Severe concern"}

function preExistingCohorts(meta){
 const out=[];
 for(let born=2016; born<=2025; born++){
  const b=meta.base;
  const strength=b.participation*.30+b.coaching*.24+b.pathway*.28+b.facilities*.08+b.potential*.10;
  out.push({born,strength,proYear:born+7,englandYear:born+10});
 }
 return out;
}

function defaultState(){
 const regions={};
 V18_REGIONS.forEach(meta=>{
  regions[meta.id]={
   structural:{
    participation:meta.base.participation, facilities:meta.base.facilities,
    coaching:meta.base.coaching, pathway:meta.base.pathway
   },
   participation:meta.base.participation, facilities:meta.base.facilities,
   coaching:meta.base.coaching, pathway:meta.base.pathway,
   potential:meta.base.potential,
   supportNeed:meta.supportNeed, coreFunding:meta.supportNeed,
   projects:[], cohorts:preExistingCohorts(meta), history:[], spend:0
  };
 });
 return {
  version:"1.8.1",year:2026,regions,projects:[],nextProjectId:1,
  pathway:{
   u18:{budget:2.40,staffCost:1.35,healthyCost:3.75,camps:4,coaching:70,identification:70,staffing:70},
   u20:{budget:3.80,staffCost:2.15,healthyCost:5.95,camps:5,coaching:72,performance:72,staffing:72}
  },
  national:{grassroots:0,infrastructure:0,pathway:0,production:0,englandDepth:0},
  annualDevelopmentCost:0,cumulativeDevelopmentSpend:0,messages:[]
 };
}

function ensure(){
 const root=window.RFU_APP_STATE||window.state||(window.state={});
 if(!root.developmentNetwork || root.developmentNetwork.version!=="1.8.1"){let d=defaultState();if(root.season)d.year=+String(root.season).slice(0,4)||d.year;root.developmentNetwork=d}
 return root.developmentNetwork;
}

function projectEffect(p,year){
 const t=V18_PROJECT_TYPES[p.type],age=year-p.startYear;
 if(age<0)return 0;
 if(age<t.delivery)return (age+1)/t.delivery*.20;
 const mature=age-t.delivery;
 if(mature<=t.peak)return .45+.55*(mature/Math.max(1,t.peak));
 const yearsAfterPeak=mature-t.peak;
 const decay=p.maintenance!==false?Math.min(.96,t.decay+.10):t.decay;
 return Math.max(t.legacy,Math.pow(decay,yearsAfterPeak));
}

function startProject(regionId,typeId){
 const d=ensure(),t=V18_PROJECT_TYPES[typeId],r=d.regions[regionId];
 if(!t||!r)return false;
 const p={id:d.nextProjectId++,regionId,type:typeId,startYear:d.year,maintenance:true};
 d.projects.push(p);r.projects.push(p.id);r.spend+=t.capital;d.cumulativeDevelopmentSpend+=t.capital;
 d.messages.unshift(`${t.name} approved in ${V18_REGIONS.find(x=>x.id===regionId)?.name||regionId}.`);
 recalculate();return true;
}
function setMaintenance(id,on){const p=ensure().projects.find(x=>x.id===id);if(p){p.maintenance=!!on;recalculate()}}
function setCoreFunding(regionId,amount){const r=ensure().regions[regionId];if(r){r.coreFunding=Math.max(0,+amount||0);recalculate()}}
function setPathwayFunding(level,budget,staffCost){
 const p=ensure().pathway[level];if(!p)return;
 p.budget=Math.max(0,+budget||0);p.staffCost=Math.max(0,+staffCost||0);recalculate();
}
function pathwayQuality(d,level){
 const p=d.pathway[level];
 if(level==="u18")return (p.coaching+p.identification+p.staffing)/3;
 return (p.coaching+p.performance+p.staffing)/3;
}

function recalculate(){
 const d=ensure();let annual=0;
 V18_REGIONS.forEach(meta=>{
  const r=d.regions[meta.id],bonus={participation:0,facilities:0,coaching:0,pathway:0};
  d.projects.filter(p=>p.regionId===meta.id).forEach(p=>{
   const t=V18_PROJECT_TYPES[p.type],m=projectEffect(p,d.year);
   Object.entries(t.effects).forEach(([k,v])=>bonus[k]+=v*m);
   if(p.maintenance!==false)annual+=t.annual;
  });
  r.participation=clamp(r.structural.participation+bonus.participation);
  r.facilities=clamp(r.structural.facilities+bonus.facilities);
  r.coaching=clamp(r.structural.coaching+bonus.coaching);
  r.pathway=clamp(r.structural.pathway+bonus.pathway);
  annual+=r.coreFunding;
 });
 annual+=d.pathway.u18.budget+d.pathway.u18.staffCost+d.pathway.u20.budget+d.pathway.u20.staffCost;
 d.annualDevelopmentCost=annual;

 const rs=Object.values(d.regions),avg=k=>rs.reduce((a,r)=>a+r[k],0)/rs.length;
 d.national.grassroots=clamp(avg("participation")*.55+avg("coaching")*.25+avg("facilities")*.20);
 d.national.infrastructure=clamp(avg("facilities"));
 const u18q=pathwayQuality(d,"u18"),u20q=pathwayQuality(d,"u20");
 d.national.pathway=clamp(avg("pathway")*.82+u18q*.08+u20q*.10);

 const pro=rs.flatMap(r=>r.cohorts).filter(c=>c.proYear<=d.year&&c.proYear>d.year-5);
 const proRaw=pro.length?pro.reduce((a,c)=>a+c.strength,0)/pro.length:d.national.grassroots;
 d.national.production=clamp(proRaw*.85+d.national.pathway*.15);

 const england=rs.flatMap(r=>r.cohorts).filter(c=>c.englandYear<=d.year&&c.englandYear>d.year-5);
 const raw=england.length?england.reduce((a,c)=>a+c.strength,0)/england.length:proRaw;
 const pathwayDevelopment=(u18q-60)*.06+(u20q-60)*.10;
 d.national.englandDepth=clamp(raw+pathwayDevelopment);
 return d;
}

function advanceYear(){
 const d=recalculate();
 V18_REGIONS.forEach(meta=>{
  const r=d.regions[meta.id];
  const strength=clamp(r.participation*.30+r.coaching*.24+r.pathway*.28+r.facilities*.08+r.potential*.10);
  r.cohorts.push({born:d.year,strength,proYear:d.year+7,englandYear:d.year+10});
  if(r.cohorts.length>35)r.cohorts.shift();
  r.history.push({year:d.year,participation:r.participation,facilities:r.facilities,coaching:r.coaching,pathway:r.pathway});
  if(r.history.length>45)r.history.shift();

  const ratio=r.supportNeed>0?r.coreFunding/r.supportNeed:0;
  r.structural.participation=clamp(r.structural.participation+(ratio-1)*.95-.05);
  r.structural.facilities=clamp(r.structural.facilities+(ratio-1)*1.75-.12);
  r.structural.coaching=clamp(r.structural.coaching+(ratio-1)*1.35-.08);
  r.structural.pathway=clamp(r.structural.pathway+(ratio-1)*1.20-.06);
 });

 [["u18","identification"],["u20","performance"]].forEach(([level,special])=>{
  const p=d.pathway[level],resource=p.budget+p.staffCost,ratio=p.healthyCost>0?resource/p.healthyCost:0;
  const delta=(ratio-1)*2.0-.08;
  p.staffing=clamp(p.staffing+delta);
  p.coaching=clamp(p.coaching+delta*.85);
  p[special]=clamp(p[special]+delta*.75);
 });

 d.cumulativeDevelopmentSpend+=d.annualDevelopmentCost;
 d.year++;
 return recalculate();
}

function snapshot(){
 const d=recalculate();
 return {
  year:d.year,annualCost:d.annualDevelopmentCost,cumulativeSpend:d.cumulativeDevelopmentSpend,
  regions:V18_REGIONS.map(m=>{
   const r=d.regions[m.id];
   return {id:m.id,name:m.name,...r,
    outlook:qualityLabel((r.participation+r.facilities+r.coaching+r.pathway)/4),
    supportLabel:r.coreFunding>=r.supportNeed*1.1?"Enhanced":r.coreFunding>=r.supportNeed*.9?"Maintained":r.coreFunding>=r.supportNeed*.5?"Reduced":"Severely reduced"};
  }),
  pathway:d.pathway,national:d.national
 };
}

window.RFUDevelopmentV18={
 ensure,recalculate,startProject,setMaintenance,setCoreFunding,setPathwayFunding,advanceYear,snapshot,
 projectTypes:V18_PROJECT_TYPES,regions:V18_REGIONS,qualityLabel
};
ensure();recalculate();
})();
</script>

FURegionalFunding?window.setRFURegionalFunding(id,Number(b.dataset.fund)):A.setCoreFunding(id,r.supportNeed*Number(b.dataset.fund)));host.querySelectorAll('[data-maint]').forEach(b=>b.onclick=()=>{const p=A.ensure().projects.find(x=>x.id===Number(b.dataset.maint));if(window.setRFUProjectMaintenance)window.setRFUProjectMaintenance(p.id,!p.maintenance);else A.setMaintenance(p.id,!p.maintenance)})}

.dataset.delta)))}

ects button{margin-top:7px}.v18-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.v18-actions button,.v18-funding button,.v18-projects button,.v18-inline-actions button{border:1px solid var(--line);background:#13211c;color:var(--text);padding:9px;border-radius:8px;text-align:left;cursor:pointer;font-weight:800}.v18-actions button:hover,.v18-funding button:hover,.v18-projects button:hover,.v18-inline-actions button:hover{background:#1a3027}.v18-actions small{display:block;font-weight:400;color:var(--muted);margin-top:3px}.v18-funding,.v18-inline-actions{display:flex;gap:6px;flex-wrap:wrap}.v18-copy{font-size:11px;color:var(--muted)}.v18-path-warning{margin-top:12px;border-left:3px solid #456355;background:#0b1813;padding:10px 12px;font-size:12px;color:#b9c8c1}@media(max-width:900px){.v18-layout{grid-template-columns:1fr}.v18-summary{grid-template-columns:1fr}.v18-actions{grid-template-columns:1fr}}
