const OPPONENTS={six:['France','Ireland','Italy','Scotland','Wales'], autumn:['Australia','New Zealand','South Africa','Fiji','Japan','Argentina'], summer:['Australia','Argentina','Japan','New Zealand','South Africa','USA','Canada','Fiji']};
const PROGRAMMES={

 elite:{name:'England Senior Programme',score:85,funding:9.0,desc:'National team staffing, camps, medical and performance.'}

function freshClubs(){return CLUBS.map((name,i)=>({name,quality:72+Math.floor(Math.random()*17),academy:62+Math.floor(Math.random()*27),finance:55+Math.floor(Math.random()*35),p:0,w:0,d:0,l:0,pf:0,pa:0,tbp:0,lbp:0,pts:0}));}

function initWorldRankings(){return [{name:'South Africa',rating:92},{name:'Ireland',rating:90},{name:'England',rating:89},{name:'New Zealand',rating:88},{name:'France',rating:86},{name:'Argentina',rating:82},{name:'Scotland',rating:80},{name:'Australia',rating:78},{name:'Fiji',rating:77},{name:'Italy',rating:74},{name:'Wales',rating:73},{name:'Japan',rating:72}] }
function initialState(){return {
 version:2, nation:'England', union:'Rugby Football Union', director:'Director', date:'2026-09-01', season:'2026/27', balance:84.2, debt:38, annualRevenue:221, annualSpend:206,
 relationships:{board:72,fans:68,media:56,clubs:61,community:74,players:69},
 traits:[], programmes:JSON.parse(JSON.stringify(PROGRAMMES)),
 participation:{registered:1842000,youth:412000,clubs:1820,coaches:36400,referees:6800},
 stadium:{name:'National Stadium',capacity:82000,condition:84,hospitality:8,fan:7,media:8,pitch:9,upgrade:null},
 training:{name:'National Performance Centre',quality:78,condition:87,upgrade:null},
 centres:[{name:'North Development Centre',quality:64},{name:'Midlands Development Centre',quality:69},{name:'London & South East Centre',quality:75},{name:'South West Development Centre',quality:72}],
 projects:[], sponsors:[
  {slot:'Principal Partner',name:'Crown & Field',annual:14.0,expires:'2028-06-30',sentiment:70},
  {slot:'Kit Supplier',name:'Albion Sports',annual:9.5,expires:'2029-06-30',sentiment:76},
  {slot:'Training Partner',name:'Vertex Performance',annual:3.2,expires:'2027-06-30',sentiment:65}
 ],
 objectives:[
  {name:'Keep cash reserves above £50m',target:50,type:'cash'},
  {name:'Increase youth participation by 8%',target:444960,type:'youth'},
  {name:'Maintain elite programme above 80',target:80,type:'elite'},
  {name:'Raise referee programme to 68',target:68,type:'referees'}
 ],
 england:{ranking:3,wins:0,losses:0,draws:0,lastResult:'—',headCoach:'Steve Borthwick',headCoachAge:46,headCoachSince:'2022',contractUntil:'2027',tests:[]}, sixTable:initSixTable(), worldRankings:initWorldRankings(), clubs:freshClubs(), calendar:[], inbox:[], financeLog:[], processed:{}, weekCounter:0, customEventId:1, activePage:'dashboard'
};}
let S=load()||initialState();
window.RFU_APP_STATE=S;
let DEVELOPMENT_VIEW='overview';
if(S.activePage==='programmes'){S.activePage='development';DEVELOPMENT_VIEW='overview'}
if(S.activePage==='facilities'){S.activePage='development';DEVELOPMENT_VIEW='facilities'}
if(!S.england.headCoach){S.england.headCoach='Steve Borthwick';S.england.headCoachAge=46;S.england.headCoachSince='2022';S.england.contractUntil='2027'}
if(!S.england.tests)S.england.tests=[];

if(!S.worldRankings)S.worldRankings=initWorldRankings();


function ensureProfessionalGameModel(){
 if(!S.professionalGame)S.professionalGame={
  agreement:{name:'Professional Game Partnership',health:63,yearsRemaining:7,status:'Active',
   terms:[
    {name:'Professional game funding',rfu:68,clubs:52,players:65},
    {name:'England player access',rfu:84,clubs:48,players:64},
    {name:'Player welfare & rest',rfu:71,clubs:67,players:58},
    {name:'England player agreements',rfu:69,clubs:61,players:55},
    {name:'Academies & pathways',rfu:76,clubs:70,players:72},
    {name:'Governance & cooperation',rfu:62,clubs:54,players:60}
   ]},
  playerGroup:{relationship:S.relationships.players||69,welfare:68,workload:'Managed',voice:'Constructive'},
  clubPlayerRelationship:64,
  clubs:[
   {name:'Bath Rugby',financial:72,relation:67,england:6,dependency:'Medium'},
   {name:'Bristol Bears',financial:66,relation:64,england:3,dependency:'Medium'},
   {name:'Exeter Chiefs',financial:51,relation:58,england:3,dependency:'Medium'},
   {name:'Gloucester',financial:55,relation:61,england:2,dependency:'High'},
   {name:'Harlequins',financial:64,relation:66,england:4,dependency:'Medium'},
   {name:'Leicester Tigers',financial:62,relation:59,england:5,dependency:'Medium'},
   {name:'Newcastle Falcons',financial:39,relation:49,england:1,dependency:'High'},
   {name:'Northampton Saints',financial:73,relation:68,england:5,dependency:'Low'},
   {name:'Sale Sharks',financial:60,relation:57,england:3,dependency:'Medium'},
   {name:'Saracens',financial:70,relation:56,england:7,dependency:'Medium'}
  ],
  recent:[
   {text:'Professional Game Partnership operating under current multi-year framework.',delta:0},
   {text:'Player access and welfare remain the main areas of competing pressure.',delta:0}
  ]
 };
 let pg=S.professionalGame;
 if(!pg.policy)pg.policy={
  clubFunding:24.2,
  academyFunding:10.1,
  welfare:'balanced',
  access:'balanced',
  governance:'balanced',
  lastReviewYear:null,
  history:[]
 };
 if(!Array.isArray(pg.policy.history))pg.policy.history=[];
 if(pg.policy.clubFunding==null)pg.policy.clubFunding=24.2;
 if(pg.policy.academyFunding==null)pg.policy.academyFunding=10.1;
 if(!pg.policy.welfare)pg.policy.welfare='balanced';
 if(!pg.policy.access)pg.policy.access='balanced';
 if(!pg.policy.governance)pg.policy.governance='balanced';
 if(S.financeModel){
  S.financeModel.costs.clubFunding=pg.policy.clubFunding;
  S.financeModel.costs.proAcademies=pg.policy.academyFunding;
 }
 S.relationships.clubs=Math.round(pg.clubs.reduce((a,c)=>a+c.relation,0)/pg.clubs.length);
 S.relationships.players=pg.playerGroup.relationship;
}
ensureProfessionalGameModel();


function ensureProfessionalGameStage2(){
 ensureProfessionalGameModel();let pg=S.professionalGame;
 if(!pg.eventState)pg.eventState={active:null,lastEventDate:null,cooldownUntil:null,history:[],decisionCounts:{clubs:0,players:0,finance:0}};
 if(!pg.recent)pg.recent=[];
}
ensureProfessionalGameStage2();

function pgDaysBetween(a,b){return Math.floor((new Date(b)-new Date(a))/86400000)}
function pgCanGenerate(){
 let es=S.professionalGame.eventState;
 return !es.active && (!es.cooldownUntil || S.date>=es.cooldownUntil);
}
function pgCreateIssue(type,title,body,options,context={}){
 let es=S.professionalGame.eventState;
 es.active={id:'pg_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),type,title,body,options,context,date:S.date};
 es.lastEventDate=S.date;
 notify(title,body+' A Director decision is required.','negative');
}
function pgEvaluateEvents(){
 ensureProfessionalGameStage2();
 if(!pgCanGenerate())return;
 let pg=S.professionalGame,es=pg.eventState;
 // Pull the latest hidden club-finance outputs into the professional-game political layer.
 (S.p3?.clubs||[]).forEach(c=>p3SyncProfessionalGameFinance(c));
 // Deliberately sparse: check roughly weekly and require meaningful state pressure.
 if(S.weekCounter%7!==0)return;
 let weakest=[...pg.clubs].sort((a,b)=>a.financial-b.financial)[0];
 let englandHeavy=[...pg.clubs].sort((a,b)=>b.england-a.england)[0];
 let avgClubRel=pg.clubs.reduce((a,c)=>a+c.relation,0)/pg.clubs.length;

 let liveWeak=(S.p3?.clubs||[]).find(c=>c.name===weakest.name || (weakest.name==='Bath Rugby'&&c.name==='Bath'));
 let weakRisk=liveWeak?p3ClubInterventionRisk(liveWeak):0;
 if((weakest.financial<45 || weakRisk>=70) && Math.random()<0.18){
  pgCreateIssue('club_support',`${weakest.name} seek RFU support`,
   `${weakest.name} have warned that financial pressure is beginning to threaten their professional programme. The club has asked the RFU to discuss short-term support.`,
   [
    {id:'loan',label:'£2m conditional loan'},
    {id:'limited',label:'£1m support package'},
    {id:'reject',label:'Reject request'}
   ],{club:weakest.name});return;
 }
 if(pg.playerGroup.welfare<62 && Math.random()<0.16){
  pgCreateIssue('player_rest','England players raise workload concerns',
   `Senior England players have asked the RFU for stronger protected rest periods, arguing that the current workload is becoming difficult to sustain.`,
   [{id:'rest3',label:'Protect 3-week rest'},{id:'rest2',label:'Negotiate 2 weeks'},{id:'reject',label:'Reject proposal'}]);return;
 }
 if(englandHeavy.england>=6 && englandHeavy.relation<60 && Math.random()<0.13){
  pgCreateIssue('release',`${englandHeavy.name} challenge England access`,
   `${englandHeavy.name}, who currently supply ${englandHeavy.england} England players, have questioned the burden created by England preparation and player-release requirements.`,
   [{id:'enforce',label:'Enforce RFU access'},{id:'compromise',label:'Negotiate shorter camp'},{id:'clubs',label:'Allow club priority'}],{club:englandHeavy.name});return;
 }
 if(avgClubRel<56 && Math.random()<0.12){
  pgCreateIssue('funding','Premiership clubs seek greater central funding',
   `A group of Premiership clubs are pressing the RFU for increased annual support, citing operating costs and pressure across the professional game.`,
   [{id:'full',label:'Increase funding £4m'},{id:'half',label:'Offer £2m'},{id:'reject',label:'Reject increase'}]);return;
 }
 if(pg.agreement.health<55 && Math.random()<0.12){
  pgCreateIssue('governance','PGP relationship under pressure',
   `Tensions across several areas of the Professional Game Partnership have prompted calls for a formal RFU–club working meeting.`,
   [{id:'meeting',label:'Open formal talks'},{id:'firm',label:'Maintain current position'}]);return;
 }
}
function pgFindClub(name){return S.professionalGame.clubs.find(c=>c.name===name)}
function pgAdjustClub(name,rel=0,fin=0){
 let c=pgFindClub(name);if(!c)return;
 c.relation=clamp(c.relation+rel);c.financial=clamp(c.financial+fin);
 let live=(S.p3?.clubs||[]).find(x=>x.name===name || (name==='Bath Rugby'&&x.name==='Bath'));
 if(live){
  live.rfuRelationship=clamp((live.rfuRelationship||c.relation)+rel);
  live.finance=clamp((live.finance||c.financial)+fin);
  if(fin>0)live.cash=(live.cash||0)+Math.max(.4,fin*.08);
  p3SyncProfessionalGameFinance(live);
 }
}
function pgAllClubs(rel=0,fin=0){
 S.professionalGame.clubs.forEach(c=>{c.relation=clamp(c.relation+rel);c.financial=clamp(c.financial+fin)});
 (S.p3?.clubs||[]).forEach(c=>{
  c.rfuRelationship=clamp((c.rfuRelationship||60)+rel);
  c.finance=clamp((c.finance||60)+fin);
  p3SyncProfessionalGameFinance(c);
 });
}
function pgResolveIssue(choice){
 ensureProfessionalGameStage2();let pg=S.professionalGame,es=pg.eventState,x=es.active;if(!x)return;
 let headline='',story='',tone='neutral';
 if(x.type==='club_support'){
  if(choice==='loan'){S.balance-=2;pgAdjustClub(x.context.club,8,15);headline=`RFU agrees conditional support for ${x.context.club}`;story='A £2m conditional RFU loan has been agreed. Other clubs will watch the precedent closely.';es.decisionCounts.clubs++;es.decisionCounts.finance++}
  else if(choice==='limited'){S.balance-=1;pgAdjustClub(x.context.club,4,8);headline=`Limited RFU support agreed for ${x.context.club}`;story='A £1m support package has been agreed with conditions attached.';es.decisionCounts.clubs++}
  else{pgAdjustClub(x.context.club,-9,-5);headline=`RFU rejects ${x.context.club} support request`;story='The RFU has declined emergency assistance. The club remains under financial pressure.';tone='negative';es.decisionCounts.finance++}
 }else if(x.type==='player_rest'){
  if(choice==='rest3'){pg.playerGroup.relationship=clamp(pg.playerGroup.relationship+8);pg.playerGroup.welfare=clamp(pg.playerGroup.welfare+10);pgAllClubs(-5,0);headline='RFU strengthens England player rest protections';story='A three-week protected rest period has been backed despite club concerns.';es.decisionCounts.players++}
  else if(choice==='rest2'){pg.playerGroup.relationship=clamp(pg.playerGroup.relationship+4);pg.playerGroup.welfare=clamp(pg.playerGroup.welfare+6);pgAllClubs(-1,0);headline='RFU and stakeholders compromise on player rest';story='A two-week protected rest period has been agreed.'}

 (S.p3?.clubs||[]).forEach(c=>{

 pg.clubs.forEach(c=>c.relation=clamp(c.relation+clubRel));

 S.relationships.clubs=Math.round(pg.clubs.reduce((a,c)=>a+c.relation,0)/pg.clubs.length);
 S.relationships.players=Math.round(pg.playerGroup.relationship);

function adjustRelations(changes){
 Object.entries(changes||{}).forEach(([k,v])=>{
   if(typeof S.relationships[k]!=='number')return;
   let current=S.relationships[k];

   // Positive movement gets harder as confidence rises.
   // Negative movement is intentionally sharper, especially when confidence is high.
   let applied=v;
   if(v>0){
     let headroom=(100-current)/100;
     applied=v*(0.35+headroom*0.65);
     if(current>=90)applied*=0.45;
     if(current>=96)applied*=0.25;
   }else if(v<0){
     let highPenalty=current>=80?1.35:current>=65?1.15:1;
     applied=v*highPenalty;
   }

   S.relationships[k]=clamp(current+applied);
 });
}

 clubs=[...clubs.slice(shift),...clubs.slice(0,shift)];
 for(let i=0;i<clubs.length;i+=2){
   let a=clubs[i],b=clubs[i+1];if(!b)continue;
   let as=Math.max(6,Math.round(11+a.squad*.22+a.form*.05+Math.random()*14));
   let bs=Math.max(6,Math.round(11+b.squad*.22+b.form*.05+Math.random()*14));
   if(as===bs&&Math.random()>.35)as++;
   a.played++;b.played++;a.pf+=as;a.pa+=bs;b.pf+=bs;b.pa+=as;
   if(as>bs){
     a.w++;b.l++;a.pts+=4;a.form=Math.min(100,a.form+3);b.form=Math.max(0,b.form-3);
     if(as-bs<=7)b.pts++;
   }else if(bs>as){
     b.w++;a.l++;b.pts+=4;b.form=Math.min(100,b.form+3);a.form=Math.max(0,a.form-3);
     if(bs-as<=7)a.pts++;
   }else{
     a.d++;b.d++;a.pts+=2;b.pts+=2;
   }
   if(as>=28)a.pts++;
   if(bs>=28)b.pts++;
 }
 S.p3.championshipRound=round;
}

function p3PromotionReasons(c){
 let reasons=[];
 if(c.facilities<65)reasons.push('facilities');
 if(c.finance<60)reasons.push('financial health');
 if(c.stability<58)reasons.push('organisational stability');
 return reasons;
}
function p3EligibleChampionshipClubs(){

 return p3ChampTable().filter(c=>p3PromotionReasons(c).length===0);
}
function p3ApplyTierMove(promoted,relegated){
 if(!promoted||!relegated)return;

 // Preserve the real club ecosystem records as they change tier.
 let pi=S.p3.championship.findIndex(c=>c.id===promoted.id);
 let ri=S.p3.clubs.findIndex(c=>c.name===relegated.name);
 if(pi<0||ri<0)return;

 let promotedRecord=S.p3.championship.splice(pi,1)[0];
 let relegatedRecord=S.p3.clubs.splice(ri,1)[0];

 // Core PREM league club object follows promoted club.
 let coreIndex=S.clubs.findIndex(c=>c.name===relegated.name);
 if(coreIndex>=0){
   S.clubs[coreIndex]={
     name:promotedRecord.name,p:0,w:0,d:0,l:0,pf:0,pa:0,tbp:0,lbp:0,pts:0
   };
 }

 // Convert persistent records without losing ecosystem attributes.
 promotedRecord.id='prem_'+promotedRecord.name.toLowerCase().replace(/[^a-z0-9]+/g,'_');
 promotedRecord.form=50;
 promotedRecord.stability=Math.max(20,promotedRecord.stability-2);
 promotedRecord.supporters=Math.min(95,promotedRecord.supporters+3);
 promotedRecord.finance=Math.max(20,promotedRecord.finance-1.5);

 relegatedRecord.id='champ_'+relegatedRecord.name.toLowerCase().replace(/[^a-z0-9]+/g,'_');
 relegatedRecord.form=50;
 relegatedRecord.stability=Math.max(20,relegatedRecord.stability-5);
 relegatedRecord.supporters=Math.max(20,relegatedRecord.supporters-5);
 relegatedRecord.finance=Math.max(20,relegatedRecord.finance-4);
 relegatedRecord.attendance=Math.max(1200,Math.round((relegatedRecord.attendance||5000)*.78));
 relegatedRecord.played=0;relegatedRecord.w=0;relegatedRecord.d=0;relegatedRecord.l=0;
 relegatedRecord.pf=0;relegatedRecord.pa=0;relegatedRecord.tbp=0;relegatedRecord.lbp=0;relegatedRecord.pts=0;

 S.p3.clubs.push(promotedRecord);
 S.p3.championship.push(relegatedRecord);
}
function p3EvaluatePromotion(){
 p3EnsurePyramid();
 let champ=p3ChampTable();
 let prem=[...S.clubs].sort((a,b)=>a.pts-b.pts||((a.pf-a.pa)-(b.pf-b.pa)));
 if(!champ.length||!prem.length||!champ.some(c=>c.played>0))return null;

 let champion=champ[0];
 let eligible=p3EligibleChampionshipClubs();
 // Stage 3 rule: champion must meet operating standard.
 // We do not skip down the table automatically.
 let promoted=p3PromotionReasons(champion).length===0?champion:null;
 let relegated=promoted?prem[0]:null;

 let result={
   date:S.date,season:S.season,
   champion:champion.name,
   eligible:!!promoted,
   reasons:p3PromotionReasons(champion),
   promoted:promoted?.name||null,
   relegated:relegated?.name||null
 };

 if(promoted&&relegated){
   p3ApplyTierMove(promoted,relegated);
   result.summary=`${promoted.name} promoted to the PREM; ${relegated.name} relegated to Champ Rugby.`;
 }else{
   result.summary=`${champion.name} won Champ Rugby but did not meet the promotion operating standard. No promotion or relegation occurred.`;
 }

 S.p3.pyramidHistory.unshift(result);
 S.p3.lastPyramidDecision=result;
 return result;
}

const PREM_FINANCE_BASELINE_YEAR=2024;
const PREM_GAME_START_YEAR=2026;
const PREM_REVENUE_GROWTH_TO_START=.04;   // modest annual projection, not claimed as audited
const PREM_COST_GROWTH_TO_START=.025;

function premProjectionYears(){return Math.max(0,PREM_GAME_START_YEAR-PREM_FINANCE_BASELINE_YEAR)}
function premProjectedTurnover(acc){
 return acc.turnover*Math.pow(1+PREM_REVENUE_GROWTH_TO_START,premProjectionYears());
}
function premProjectedCost(acc){
 let baseCost=acc.turnover-acc.loss;
 return baseCost*Math.pow(1+PREM_COST_GROWTH_TO_START,premProjectionYears());
}
function premNormalisedBaselineAttendance(acc){
 // Showpiece fixtures at Twickenham/Tottenham pushed some annual averages above home-ground capacity.
 // Keep that commercial value in turnover, but normalise the hidden weekly attendance engine to home capacity.
 return Math.min(acc.attendance,Math.round(acc.capacity*.94));
}

function premAccountsBaselineFor(c){
 return PREM_ACCOUNTS_BASELINE[c.name]||null;
}

function p3EnsureClubFinanceProfile(c,i=0){
 if(!c.financeProfile)c.financeProfile={};
 const fp=c.financeProfile;
 const acc=premAccountsBaselineFor(c);

 if(acc){
  if(fp.accountsBaselineYear==null)fp.accountsBaselineYear='2023/24';
  if(fp.accountsTurnover==null)fp.accountsTurnover=acc.turnover;
  if(fp.accountsLoss==null)fp.accountsLoss=acc.loss;
  if(fp.stadiumCapacity==null)fp.stadiumCapacity=acc.capacity;
  if(fp.hiddenAttendance==null)fp.hiddenAttendance=premNormalisedBaselineAttendance(acc);
  if(fp.baseDemand==null)fp.baseDemand=Math.min(.96,fp.hiddenAttendance/Math.max(1,acc.capacity));
  if(fp.ownerBacking==null)fp.ownerBacking=acc.ownerBacking;
  if(fp.resilience==null)fp.resilience=acc.resilience;
 }else{
  if(fp.stadiumCapacity==null)fp.stadiumCapacity=Math.max(8000,Math.round((c.attendance||9000)*1.25));
  if(fp.hiddenAttendance==null)fp.hiddenAttendance=Math.min(fp.stadiumCapacity,Math.max(3500,c.attendance||Math.round(fp.stadiumCapacity*.7)));
  if(fp.baseDemand==null)fp.baseDemand=Math.min(.92,fp.hiddenAttendance/fp.stadiumCapacity);
  if(fp.ownerBacking==null)fp.ownerBacking=.70;
  if(fp.resilience==null)fp.resilience=65;
  if(fp.accountsTurnover==null)fp.accountsTurnover=15;
  if(fp.accountsLoss==null)fp.accountsLoss=-2;
 }

 // Turnover baseline is the anchor. Revenue components are proportions rather
 // than invented absolute values and are rebalanced to the published total.
 if(fp.revenueBaselineAnnual==null)fp.revenueBaselineAnnual=acc?premProjectedTurnover(acc):fp.accountsTurnover;
 if(fp.operatingCostBaselineAnnual==null)fp.operatingCostBaselineAnnual=acc?premProjectedCost(acc):(fp.accountsTurnover-fp.accountsLoss);

 if(fp.matchdayShare==null){
  // Hidden attendance/capacity affects the split of turnover, not total initial turnover.
  let gateStrength=Math.min(1.05,fp.hiddenAttendance/Math.max(1,fp.stadiumCapacity));
  fp.matchdayShare=Math.max(.18,Math.min(.36,.22+gateStrength*.10));
 }
 if(fp.commercialShare==null)fp.commercialShare=Math.max(.22,Math.min(.42,.30+((c.supporters||65)-65)*.002));
 if(fp.centralShare==null)fp.centralShare=.18;
 if(fp.otherRevenueShare==null)fp.otherRevenueShare=Math.max(.08,1-fp.matchdayShare-fp.commercialShare-fp.centralShare);

 if(fp.ticketYield==null)fp.ticketYield=30+((c.supporters||60)-50)*.18;
 if(fp.matchdayAncillary==null)fp.matchdayAncillary=13+((c.facilities||60)-50)*.10;

 // Cost structure begins from published implied costs (turnover - reported result).
 // Wages are constrained around current Prem scale rather than generated from scratch.
 if(fp.playerWagesAnnual==null)fp.playerWagesAnnual=Math.max(5.4,Math.min(8.2,6.0+((c.squad||70)-70)*.055));
 if(fp.academyAnnual==null)fp.academyAnnual=Math.max(.65,.80+((c.academy||60)-60)*.012);
 if(fp.debtServiceAnnual==null)fp.debtServiceAnnual=(c.debt||0)*.05;
 if(fp.otherCostsAnnual==null)fp.otherCostsAnnual=1.05;

 const known=fp.playerWagesAnnual+fp.academyAnnual+fp.debtServiceAnnual+fp.otherCostsAnnual;

function p3LeaguePositionFactor(c){
 let table=[...(S.p3?.clubs||[])].sort((a,b)=>b.pts-a.pts||((b.pf-b.pa)-(a.pf-a.pa)));
 let ix=table.findIndex(x=>x.name===c.name);
 if(ix<0||table.length<2)return 0;
 // top club ≈ +1, bottom ≈ -1
 return 1-(ix/(table.length-1))*2;
}

function p3HiddenAttendance(c,opponent){
 p3EnsureClubFinanceProfile(c);
 let fp=c.financeProfile;
 let pos=p3LeaguePositionFactor(c);
 let form=((c.form||50)-50)/50;
 let oppDraw=((opponent?.supporters||60)-60)/100;
 let importance=(c.played>=12?.035:0)+(c.played>=16?.025:0);
 let noise=(Math.random()-.5)*.07;

 let demand=fp.baseDemand + pos*.055 + form*.05 + oppDraw*.08 + importance + noise;
 demand=Math.max(.38,Math.min(1.04,demand));

 let attendance=Math.round(fp.stadiumCapacity*demand);
 attendance=Math.max(Math.min(3200,fp.stadiumCapacity),Math.min(fp.stadiumCapacity,attendance));
 fp.hiddenAttendance=attendance;

 // Retain legacy field for internal promotion/finance calculations, but it is hidden from UI.
 c.attendance=attendance;
 return attendance;
}

function p3RecordHiddenHomeMatch(c,opponent){

 // Published turnover remains the base. Matchday variation moves only the

 let attendanceRatio=gate/Math.max(1,(premAccountsBaselineFor(c)?premNormalisedBaselineAttendance(premAccountsBaselineFor(c)):(fp.hiddenAttendance||gate)));
 let matchRevenue=baselinePerHome*Math.max(.65,Math.min(1.35,attendanceRatio));

 fp.totalHomeGames++;

 score+=fp.ownerCommitment<35?20:fp.ownerCommitment<55?10:0;

function p3ChoosePressureResponse(c,score){
 let fp=c.financeProfile;
 let choices=[];

 // Responses become unavailable for a while after use, forcing different histories.
 if(p3CanRepeatHiddenType(c,'playing_budget_cut',30))choices.push({type:'playing_budget_cut',w:score>=55?22:12});
 if(p3CanRepeatHiddenType(c,'academy_cut',36))choices.push({type:'academy_cut',w:score>=65?12:5});
 if(c.debt>15 && p3CanRepeatHiddenType(c,'debt_restructure',30))choices.push({type:'debt_restructure',w:14});
 if(fp.ownerCommitment>=45 && p3CanRepeatHiddenType(c,'owner_investment',24))choices.push({type:'owner_investment',w:12+fp.ownerBacking*10});
 if(fp.ownerCommitment<55 && p3CanRepeatHiddenType(c,'owner_exit_risk',36))choices.push({type:'owner_exit_risk',w:score>=60?14:7});
 if(p3CanRepeatHiddenType(c,'commercial_restructure',30))choices.push({type:'commercial_restructure',w:10});
 if(p3CanRepeatHiddenType(c,'recruitment_freeze',24))choices.push({type:'recruitment_freeze',w:score>=45?13:7});

 if(!choices.length)return null;
 let total=choices.reduce((n,x)=>n+x.w,0),r=Math.random()*total;
 for(const x of choices){r-=x.w;if(r<=0)return x.type}
 return choices[choices.length-1].type;
}
function p3ApplyPressureResponse(c,type,score){
 let fp=c.financeProfile;
 if(type==='playing_budget_cut'){
  p3AddHiddenClubEvent(c,type,'Club reduces playing budget',{wageBudget:-12,retention:-13,recruitment:-9,operatingCost:3},16,{source:'financial pressure',pressure:score});
  fp.hiddenStrategy.costControl++;
 }else if(type==='academy_cut'){
  p3AddHiddenClubEvent(c,type,'Club trims academy and pathway spending',{academy:-13,operatingCost:3,recruitment:-2},24,{source:'cost control',pressure:score});
  fp.hiddenStrategy.costControl++;

  p3AddHiddenClubEvent(c,type,'Club refinances part of its debt burden',{operatingCost:4,ownerSupport:3},24,{source:'finance',pressure:score});
  fp.financeEvents.restructures++;fp.hiddenStrategy.restructure++;
 }else if(type==='owner_investment'){
  let injection=.6+Math.random()*2.4;c.cash+=injection;
  p3AddHiddenClubEvent(c,type,'Ownership provides additional club investment',{ownerSupport:9,wageBudget:4,recruitment:4,academy:2},18,{cashInjection:injection,source:'ownership',pressure:score});
  fp.ownerEvents.injections++;fp.ownerEvents.injectedCash+=injection;fp.ownerEvents.boosts++;fp.hiddenStrategy.investment++;
 }else if(type==='owner_exit_risk'){
  fp.ownerCommitment=Math.max(0,fp.ownerCommitment-(5+Math.random()*10));
  p3AddHiddenClubEvent(c,type,'Owner reduces long-term commitment',{ownerSupport:-14,wageBudget:-7,retention:-9,academy:-4},24,{source:'ownership',pressure:score});
  fp.ownerEvents.stepBacks++;
 }else if(type==='commercial_restructure'){
  p3AddHiddenClubEvent(c,type,'Club restructures commercial operation',{commercial:5,operatingCost:-2,recruitment:2},18,{source:'commercial response',pressure:score});
 }else if(type==='recruitment_freeze'){
  p3AddHiddenClubEvent(c,type,'Club freezes parts of recruitment',{wageBudget:-5,recruitment:-11,retention:-4,operatingCost:2},12,{source:'cost control',pressure:score});
  fp.hiddenStrategy.costControl++;
 }
 if(type)p3RememberHiddenType(c,type);
}

function p3GenerateHiddenClubEvent(c){
 p3EnsureClubFinanceProfile(c);
 let fp=c.financeProfile;
 if(fp.hiddenEventCooldown>0)return;

 let pressure=p3UpdateHiddenPressureState(c);
 let form=c.form||50;

 // Under genuine financial pressure, club management chooses a response.
 if(pressure>=30){
  let chance=Math.min(.13,.022+pressure*.0009+fp.hiddenEscalation*.012);
  if(Math.random()<chance){
   let response=p3ChoosePressureResponse(c,pressure);
   if(response){p3ApplyPressureResponse(c,response,pressure);return;}
  }
 }

 // Normal club-world events remain sparse and state-aware.
 let roll=Math.random();

 if(roll<.018 && p3CanRepeatHiddenType(c,'commercial_gain',18)){
  p3AddHiddenClubEvent(c,'commercial_gain','New commercial agreement strengthens club income',{commercial:9,recruitment:3,retention:2},22,{source:'commercial'});
  fp.financeEvents.commercialWins++;p3RememberHiddenType(c,'commercial_gain');return;
 }
 if(roll<.032 && p3CanRepeatHiddenType(c,'commercial_loss',18)){
  p3AddHiddenClubEvent(c,'commercial_loss','Commercial income comes under pressure',{commercial:-8,wageBudget:-3,retention:-2},18,{source:'commercial'});
  fp.financeEvents.commercialLosses++;p3RememberHiddenType(c,'commercial_loss');return;
 }
 if(roll<.040 && fp.ownerCommitment>65 && p3CanRepeatHiddenType(c,'owner_investment',24)){
  p3ApplyPressureResponse(c,'owner_investment',pressure);return;
 }
 if(form>68 && c.finance>55 && roll<.052 && p3CanRepeatHiddenType(c,'sporting_momentum',14)){
  p3AddHiddenClubEvent(c,'sporting_momentum','Strong sporting period improves club momentum',{commercial:5,recruitment:5,retention:4},10,{source:'performance'});
  p3RememberHiddenType(c,'sporting_momentum');return;
 }

 // Recovery can unwind some pressure and protect pathways.
 if(pressure<22 && fp.hiddenRecoveryMonths>=10 && roll<.060 && p3CanRepeatHiddenType(c,'academy_reinvestment',30)){
  p3AddHiddenClubEvent(c,'academy_reinvestment','Club restores investment in development',{academy:8,recruitment:3,operatingCost:-1},24,{source:'recovery'});
  fp.hiddenStrategy.academyProtection++;p3RememberHiddenType(c,'academy_reinvestment');return;
 }
}

function p3RFUSignalScore(c){
 p3EnsureClubFinanceProfile(c);
 let fp=c.financeProfile,m=p3RecalcHiddenMods(c);
 let retention=0,pathway=0,ownership=0,continuity=0;

 // England retention risk can arise long before club insolvency.
 retention += (c.englandPlayers||0)>=6?18:(c.englandPlayers||0)>=4?12:(c.englandPlayers||0)>=2?5:0;
 retention += Math.max(0,-m.retention)*1.5;
 retention += Math.max(0,-m.wageBudget)*.8;
 retention += Math.max(0,-m.commercial)*.45;
 if((fp.financeEvents?.commercialLosses||0)>0)retention+=3;
 if(fp.ownerCommitment<60)retention+=5;
 if(fp.ownerCommitment<50)retention+=7;
 if(fp.ownerCommitment<40)retention+=10;

 // Pathway risk is driven by academy cuts and sustained club pressure.
 pathway += Math.max(0,-m.academy)*1.7;
 if(c.academy<55)pathway+=8;
 if(c.finance<48)pathway+=7;
 if(fp.hiddenPressureMonths>=12)pathway+=6;

 // Ownership/governance becomes relevant when support is changing, not only at collapse.
 ownership += fp.ownerCommitment<50?14:0;
 ownership += fp.ownerCommitment<35?14:0;
 ownership += (fp.ownerEvents?.stepBacks||0)>0?8:0;
 ownership += Math.max(0,-m.ownerSupport)*1.2;

 // Continuity remains the highest bar.
 continuity += c.cash<0?22:c.cash<4?14:c.cash<8?6:0;
 continuity += c.debt>28?20:c.debt>20?12:c.debt>14?6:0;
 continuity += c.finance<35?24:c.finance<45?14:c.finance<55?7:0;
 continuity += fp.ownerCommitment<30?20:fp.ownerCommitment<45?10:0;

 let out={
  retention:Math.max(0,Math.min(100,Math.round(retention))),
  pathway:Math.max(0,Math.min(100,Math.round(pathway))),
  ownership:Math.max(0,Math.min(100,Math.round(ownership))),
  continuity:Math.max(0,Math.min(100,Math.round(continuity)))
 };
 fp.rfuSignals=out;
 fp.lastRFUSignalReview=S.date;
 return out;
}

function p3RunClubFinanceMonth(c){
 p3EnsureClubFinanceProfile(c);
 p3HiddenFinanceVariation(c);
 let fp=c.financeProfile;
 fp.debtServiceAnnual=(c.debt||0)*.05;

 // Non-matchday revenue remains anchored to reported turnover, with slow trend.
 let hm=p3RecalcHiddenMods(c);
 let commercialFactor=1+(hm.commercial/100)*.22;
 let annualRevenue=fp.revenueBaselineAnnual*fp.revenueTrend*commercialFactor;
 let matchdayAnnual=annualRevenue*fp.matchdayShare;
 let nonMatchAnnual=Math.max(0,annualRevenue-matchdayAnnual);
 let recurringRevenue=nonMatchAnnual/12;

 let revenue=recurringRevenue+fp.monthlyMatchdayIncome+fp.monthlyCompetitionIncome;

 let costFactor=1-(hm.operatingCost/100)*.08+(Math.max(0,hm.wageBudget)/100)*.03;
 let annualCost=fp.operatingCostBaselineAnnual*fp.costTrend*costFactor;
 let costs=annualCost/12;
 let operatingResult=revenue-costs;

 // Owners/benefactors fund some losses, but funding is external support rather
 // than club revenue/profit. Capacity and willingness are separate.
 let ownerFunding=0;
 if(operatingResult<0 && fp.ownerCommitment>10){
   let annualRemaining=Math.max(0,fp.ownerFundingCapacityAnnual-fp.seasonOwnerFunding);
   let willingness=Math.max(.08,Math.min(.98,.30+fp.ownerBacking*.62+(hm.ownerSupport/100)*.22));
   ownerFunding=Math.min(-operatingResult*willingness,annualRemaining);
   fp.ownerCommitment=Math.max(0,fp.ownerCommitment-Math.max(0,-operatingResult)*.08);
 }

 let cashResult=operatingResult+ownerFunding;
 fp.lastMonthlyOperatingResult=operatingResult;
 fp.lastOwnerFunding=ownerFunding;
 fp.seasonOperatingResult+=operatingResult;
 fp.seasonOwnerFunding+=ownerFunding;
 fp.seasonRevenue+=revenue;
 fp.seasonCosts+=costs;
 fp.trailingResults.push(operatingResult);
 if(fp.trailingResults.length>12)fp.trailingResults.shift();

 c.cash=Math.max(-25,c.cash+cashResult);

 if(c.cash<0){
   let borrow=Math.min(.45,.05+Math.abs(c.cash)*.035);
   c.debt=Math.min(40,c.debt+borrow);
   c.cash+=borrow;
 }else if(c.cash>20 && c.debt>2){
   let repay=Math.min(.08,c.debt-2);
   c.debt-=repay;c.cash-=repay;
 }

 // Financial health reflects sustainability, not whether the club made a loss.
 // It moves slowly and weights owner capacity/resilience/cash/debt.
 let trailing=fp.trailingResults.reduce((a,b)=>a+b,0)/Math.max(1,fp.trailingResults.length);
 let sustainability=(fp.resilience-65)/100;
 let move=operatingResult*.055+trailing*.045+sustainability*.10;
 if(c.cash<0)move-=.20;
 if(c.cash>12)move+=.035;
 if(c.debt>25)move-=.13;
 if(fp.ownerCommitment<30)move-=.16;
 c.finance=Math.max(20,Math.min(95,c.finance+move));
 let risk=p3ClubInterventionRisk(c);
 fp.lastInterventionRisk=risk;
 if(risk>=70)fp.interventionRiskMonths++;

 c.stability=Math.max(20,Math.min(95,
   c.finance*.50+(c.rfuRelationship||60)*.12+(c.facilities||60)*.10+
   (c.supporters||60)*.18+fp.resilience*.10
 ));

 fp.monthlyMatchdayIncome=0;
 fp.monthlyCompetitionIncome=0;
 fp.monthlyHomeGames=0;
 p3SyncProfessionalGameFinance(c);
}

function p3SimClubRound(){
 p3Ensure();
 let clubs=[...S.p3.clubs].sort(()=>Math.random()-.5);
 for(let i=0;i<clubs.length;i+=2){
   let a=clubs[i],b=clubs[i+1]; if(!b)continue;
   p3RecordHiddenHomeMatch(a,b);
   let ar=a.squad+a.form*.18+(Math.random()*24-12);
   let br=b.squad+b.form*.18+(Math.random()*24-12);
   let ap=Math.max(8,Math.round(18+ar*.22+Math.random()*16));
   let bp=Math.max(8,Math.round(18+br*.22+Math.random()*16));
   if(ap===bp && Math.random()>.35)ap++;
   a.played++;b.played++;a.pf+=ap;a.pa+=bp;b.pf+=bp;b.pa+=ap;
   if(ap>bp){a.w++;b.l++;a.pts+=4;a.form=Math.min(100,a.form+3);b.form=Math.max(0,b.form-3)}
   else if(bp>ap){b.w++;a.l++;b.pts+=4;b.form=Math.min(100,b.form+3);a.form=Math.max(0,a.form-3)}
   else {a.d++;b.d++;a.pts+=2;b.pts+=2}
   if(Math.abs(ap-bp)<=7){a.pts++;b.pts++}
   if(ap>=4*7)a.pts++;
   if(bp>=4*7)b.pts++;
 }
}

function updateSixTable(h,a,hs,as){let H=S.sixTable[h],A=S.sixTable[a];if(!H||!A)return;H.p++;A.p++;H.pf+=hs;H.pa+=as;A.pf+=as;A.pa+=hs;if(hs>as){H.w++;A.l++;H.pts+=4;if(hs-as<=7)A.pts++}else if(as>hs){A.w++;H.l++;A.pts+=4;if(as-hs<=7)H.pts++}else{H.d++;A.d++;H.pts+=2;A.pts+=2}H.pd=H.pf-H.pa;A.pd=A.pf-A.pa}
function simulateOtherSixMatches(date,engOpp){let teams=['France','Ireland','Italy','Scotland','Wales'].filter(x=>x!==engOpp);for(let i=0;i<teams.length-1;i+=2){let h=teams[i],a=teams[i+1];if(!a)continue;let hr=opponentStrength(h),ar=opponentStrength(a),hs=Math.max(6,Math.round(20+(hr-ar)*.45+Math.random()*15)),as=Math.max(6,Math.round(18+(ar-hr)*.45+Math.random()*15));updateSixTable(h,a,hs,as)}}

// Hidden club-contract simulation
// Club employment data is NOT RFU-facing data. It exists only to drive
// player movement, club squad behaviour and future England/RFU stories.
// ------------------------------------------------------------------
function hiddenClubName(name){
 return name==='Bath Rugby'?'Bath':name;
}
function hiddenContractClub(cname){
 p3Ensure();
 let n=hiddenClubName(cname);
 return S.p3.clubs.find(c=>c.name===n||c.name===cname)||null;
}
function hiddenPlayerImportance(p){
 return p.status==='Key Player'?92:p.status==='First Choice'?78:p.status==='Squad'?58:45;
}
function hiddenSalaryBandForPlayer(p){
 let importance=hiddenPlayerImportance(p),age=p.age||26,caps=p.caps||0;
 let base=importance*.72+Math.min(18,caps*.12)+(age>=29?3:0);
 return base>=88?'elite':base>=72?'senior':base>=57?'established':'squad';
}
function hiddenSalaryEstimate(band){
 return {elite:560000,senior:430000,established:310000,squad:220000}[band]||260000;
}
function hiddenDecisionProfile(p){
 // Stable pseudo-personality from the player's name so a save does not randomly
 // rewrite who the player is every month.
 let seed=[...p.name].reduce((n,ch)=>n+ch.charCodeAt(0),0);
 let n=(m)=>40+((seed*m)%51);
 return {
  money:n(3),
  england:n(5)+(p.status==='Key Player'?10:p.status==='First Choice'?6:0),
  loyalty:n(7),
  security:n(11)+(p.age>=30?8:0),
  ambition:n(13),
  overseasInterest:n(17)
 };
}
function hiddenPlayerFormScore(p){
 return p.form==='Excellent'?90:p.form==='Good'?78:p.form==='Stable'?66:p.form==='Average'?56:p.form==='Poor'?42:60;
}
function hiddenPlayerFitnessScore(p){
 return p.fitness==='Fit'?75:p.fitness==='Returning'?62:p.fitness==='Minor concern'?54:p.fitness==='Injured'?35:60;
}
function hiddenPlayerMarketValueScore(p,ct){
 let age=p.age||26,ageCurve=age<=24?8:age<=28?12:age<=31?7:age<=33?1:-8;
 let capsBoost=Math.min(18,(p.caps||0)*.16);
 let statusBoost=p.status==='Key Player'?18:p.status==='First Choice'?12:p.status==='Squad'?4:0;
 return Math.max(10,Math.min(100,Math.round(hiddenPlayerFormScore(p)*.45+statusBoost+capsBoost+ageCurve)));
}
function hiddenContractFailureReason(p,ct,affordability,intent,playerStayScore){
 let market=hiddenPlayerMarketValueScore(p,ct);
 let reasons=[];
 if(affordability<40)reasons.push(['club_affordability',28+(40-affordability)]);
 if(intent<45)reasons.push(['club_release',26+(45-intent)]);
 if(playerStayScore<58)reasons.push(['player_rejects_terms',24+(58-playerStayScore)]);
 if(ct.decision.security>72 && (p.age||26)>=29)reasons.push(['security_gap',20+(ct.decision.security-72)*.6]);
 if(ct.overseasInterest>55)reasons.push(['overseas_interest',18+(ct.overseasInterest-55)*.7]);
 if(ct.domesticInterest>60)reasons.push(['domestic_interest',14+(ct.domesticInterest-60)*.6]);
 if(market<42 && (p.age||26)>=31)reasons.push(['age_profile',18+(42-market)*.4]);
 if(!reasons.length)reasons.push(['terms_not_agreed',20]);

 let total=reasons.reduce((n,x)=>n+x[1],0),r=Math.random()*total;
 for(const x of reasons){r-=x[1];if(r<=0)return x[0]}
 return reasons[reasons.length-1][0];
}
function hiddenContractLengthYears(p,ct){
 let age=p.age||26;
 if(age>=34)return Math.random()<.72?1:2;
 if(age>=31)return Math.random()<.62?2:1;
 if(age<=24)return 3+Math.floor(Math.random()*2); // 3-4
 return 2+Math.floor(Math.random()*3); // 2-4
}

function ensureHiddenClubContracts(){
 if(!S.hiddenClubContracts)S.hiddenClubContracts={players:{},lastMonthlyTick:null,history:[],stats:{reviews:0,renewals:0,renewalFailures:0,pressureCases:0}};
 let root=S.hiddenClubContracts;
 if(!root.players)root.players={};
 if(!Array.isArray(root.history))root.history=[];
 if(!root.stats)root.stats={reviews:0,renewals:0,renewalFailures:0,pressureCases:0,failureReasons:{}};

 ENGLAND_PLAYER_OVERVIEW.forEach((p,i)=>{
  if(root.players[p.name])return;
  let years=2+((i*7+p.age)%3); // deterministic 2-4 year initial contract
  let expiryYear=+S.season.slice(0,4)+years;
  let band=hiddenSalaryBandForPlayer(p);
  root.players[p.name]={
   player:p.name,
   club:p.club,
   startedClub:p.club,
   salaryBand:band,
   salaryEstimate:hiddenSalaryEstimate(band),
   contractEnd:`${expiryYear}-06-30`,
   retentionPriority:hiddenPlayerImportance(p),
   decision:hiddenDecisionProfile(p),
   status:'contracted',
   renewalState:'none',
   clubOfferStrength:null,
   overseasInterest:0,
   domesticInterest:0,
   monthsToExpiry:null,
   englishServiceYears:Number.isFinite(p.englishProServiceYears)?p.englishProServiceYears:0,
   yearsAbroad:0,
   lastReview:null,
   lastOutcome:null,
   reviewMilestones:{},
   pressureRecorded:false,
   failureRecorded:false,
   contractCycle:1,
   renewedThisCycle:false,
   nextReviewEligibleDate:null,
   failureReason:null
  };
 });
 return root;
}
function hiddenMonthsUntil(dateStr){
 let a=new Date(S.date+'T12:00:00'),b=new Date(dateStr+'T12:00:00');
 return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth());
}
function hiddenContractAffordability(p,ct){
 let club=hiddenContractClub(ct.club);
 if(!club)return 55;
 p3EnsureClubFinanceProfile(club);
 let fp=club.financeProfile,hm=p3RecalcHiddenMods(club);
 let score=65;
 score+=(club.finance-60)*.45;
 score+=(fp.ownerCommitment-65)*.22;
 score+=hm.wageBudget*.65;
 score+=hm.retention*.65;
 score+=hm.commercial*.18;
 score-=Math.max(0,ct.retentionPriority-75)*.08; // elite players are expensive to retain
 return Math.max(5,Math.min(95,Math.round(score)));
}
function hiddenClubRenewalIntent(p,ct){
 let club=hiddenContractClub(ct.club);
 if(!club)return 50;
 let importance=ct.retentionPriority;
 let agePenalty=(p.age||26)>=34?20:(p.age||26)>=31?8:0;
 let squadNeed=(club.squad||70)<75?8:0;
 return Math.max(5,Math.min(98,Math.round(importance+squadNeed-agePenalty)));
}
function hiddenContractPressureScore(p,ct){
 let affordability=hiddenContractAffordability(p,ct);
 let intent=hiddenClubRenewalIntent(p,ct);
 let pressure=(100-affordability)*.55+(100-intent)*.20;
 pressure+=ct.salaryBand==='elite'?10:ct.salaryBand==='senior'?5:0;
 return Math.max(0,Math.min(100,Math.round(pressure)));
}
function hiddenContractRecord(type,p,ct,meta={}){
 let root=ensureHiddenClubContracts();
 root.history.unshift({date:S.date,type,player:p.name,club:ct.club,meta:{...meta}});
 root.history=root.history.slice(0,160);
}
function hiddenRenewContract(p,ct,affordability){
 if(ct.renewedThisCycle)return;
 let years=hiddenContractLengthYears(p,ct);
 let expiry=new Date(S.date+'T12:00:00');
 expiry.setFullYear(expiry.getFullYear()+years);
 expiry.setMonth(5);expiry.setDate(30);

 ct.contractEnd=iso(expiry);
 ct.status='contracted';
 ct.renewalState='renewed';
 ct.clubOfferStrength=affordability;
 ct.lastOutcome='renewed';
 ct.failureReason=null;
 ct.overseasInterest=0;
 ct.domesticInterest=0;

 ct.reviewMilestones={};
 ct.pressureRecorded=false;
 ct.failureRecorded=false;
 ct.renewedThisCycle=true;
 ct.contractCycle=(ct.contractCycle||1)+1;

 // Critical: block further formal renewal reviews until the final year of the NEW deal.
 let reviewUnlock=new Date(expiry);
 reviewUnlock.setFullYear(reviewUnlock.getFullYear()-1);
 ct.nextReviewEligibleDate=iso(reviewUnlock);

 ensureHiddenClubContracts().stats.renewals++;
 hiddenContractRecord('renewal',p,ct,{years,affordability,cycle:ct.contractCycle});
}
function hiddenReviewClubContract(p,ct){
 let root=ensureHiddenClubContracts();
 ct.monthsToExpiry=hiddenMonthsUntil(ct.contractEnd);
 let affordability=hiddenContractAffordability(p,ct);
 let intent=hiddenClubRenewalIntent(p,ct);
 let pressure=hiddenContractPressureScore(p,ct);

 let market=hiddenPlayerMarketValueScore(p,ct);
 let form=hiddenPlayerFormScore(p);
 let fitness=hiddenPlayerFitnessScore(p);
 let statusBoost=p.status==='Key Player'?18:p.status==='First Choice'?10:0;

 // Market interest moves with reputation, age, form, contract pressure and club affordability.
 ct.overseasInterest=Math.max(0,Math.min(100,Math.round(
   market*.38 + statusBoost + ct.decision.overseasInterest*.20 +
   (100-affordability)*.22 + (ct.monthsToExpiry<=12?8:0) - (p.age>=34?9:0)
 )));
 ct.domesticInterest=Math.max(0,Math.min(100,Math.round(
   market*.34 + statusBoost*.75 + (100-affordability)*.16 +
   (ct.monthsToExpiry<=12?6:0) - (p.age>=34?6:0)
 )));

 // Once a new contract has been signed, ignore all formal review logic until the new final year.
 if(ct.renewedThisCycle){
  if(ct.nextReviewEligibleDate && S.date < ct.nextReviewEligibleDate)return;
  ct.renewedThisCycle=false;
 }

 let milestones=[12,9,6,3];
 let milestone=milestones.find(m=>ct.monthsToExpiry<=m && ct.monthsToExpiry>m-3 && !ct.reviewMilestones?.[m]);

 if(milestone){
  if(!ct.reviewMilestones)ct.reviewMilestones={};
  ct.reviewMilestones[milestone]=true;
  ct.lastReview=S.date;
  root.stats.reviews++;
  ct.renewalState='under_review';
  ct.clubOfferStrength=Math.round(affordability*.60+intent*.40);

  let playerStayScore=
    ct.decision.loyalty*.18+
    ct.decision.england*.18+
    ct.clubOfferStrength*.32+
    ct.decision.security*.10+
    form*.10+
    fitness*.05+
    (100-ct.overseasInterest)*.07;

  let urgency=milestone<=6?6:milestone<=9?3:0;
  let baseChance=.18 + urgency*.015;
  baseChance += (affordability-50)*.006;
  baseChance += (intent-50)*.004;
  baseChance += (playerStayScore-60)*.007;
  baseChance -= Math.max(0,ct.overseasInterest-55)*.004;
  baseChance -= Math.max(0,ct.domesticInterest-65)*.002;
  baseChance=Math.max(.04,Math.min(.88,baseChance));

  if(Math.random()<baseChance && affordability>=34 && intent>=40){
    hiddenRenewContract(p,ct,affordability);
    return;
  }

  if(pressure>=32 && !ct.pressureRecorded){
    root.stats.pressureCases++;
    ct.pressureRecorded=true;
    ct.renewalState='retention_pressure';
    hiddenContractRecord('retention_pressure',p,ct,{pressure,affordability,intent,milestone,market});
  }
 }

 if(ct.monthsToExpiry<0 && !ct.failureRecorded){
  let finalStayScore=
    ct.decision.loyalty*.18+
    ct.decision.england*.18+
    (ct.clubOfferStrength||0)*.32+
    ct.decision.security*.10+
    form*.10+
    fitness*.05+
    (100-ct.overseasInterest)*.07;

  ct.status='expired_unresolved';
  ct.renewalState='failed';
  ct.lastOutcome='renewal_failed';
  ct.failureRecorded=true;
  ct.failureReason=hiddenContractFailureReason(p,ct,affordability,intent,finalStayScore);

  root.stats.renewalFailures++;
  if(!root.stats.failureReasons)root.stats.failureReasons={};
  root.stats.failureReasons[ct.failureReason]=(root.stats.failureReasons[ct.failureReason]||0)+1;
  hiddenContractRecord('renewal_failed',p,ct,{
    pressure,affordability,intent,reason:ct.failureReason,market,
    overseasInterest:ct.overseasInterest,domesticInterest:ct.domesticInterest
  });
 }
}

function hiddenIsEnglishClub(name){
 return !!hiddenContractClub(name);
}
function hiddenRetirementChance(p,ct){
 let age=p.age||25;
 if(age<31)return 0;
 let chance=age===31?.015:age===32?.035:age===33?.08:age===34?.15:age===35?.28:age===36?.46:age===37?.68:.88;
 if(p.status==='Key Player')chance*=.72;
 if(hiddenPlayerFitnessScore(p)<58)chance*=1.25;
 if((ct?.decision?.security||50)>75)chance*=.92;
 return Math.max(0,Math.min(.95,chance));
}
function hiddenGenerateProspect(replacePos,replaceGroup){
 let used=new Set(ENGLAND_PLAYER_OVERVIEW.map(p=>p.name));
 let name='';
 for(let i=0;i<30&&!name;i++){
  let a=HIDDEN_PROSPECT_FIRST[Math.floor(Math.random()*HIDDEN_PROSPECT_FIRST.length)];
  let b=HIDDEN_PROSPECT_LAST[Math.floor(Math.random()*HIDDEN_PROSPECT_LAST.length)];
  if(!used.has(`${a} ${b}`))name=`${a} ${b}`;
 }
 if(!name)name=`England Prospect ${Date.now().toString().slice(-4)}`;
 p3Ensure();
 let clubs=S.p3.clubs.filter(c=>c.name!=='Newcastle Falcons'||Math.random()<.5);
 let club=clubs[Math.floor(Math.random()*clubs.length)]?.name||'Northampton Saints';
 let age=20+Math.floor(Math.random()*4);
 let player={
  name,pos:replacePos||'FL',group:replaceGroup||'Back row',age,club,
  form:'Stable',trend:'flat',fitness:'Fit',status:'Squad',caps:Math.random()<.2?1:0,
  rfu:'EPS',eligible:'England',englishProServiceYears:0,generated:true,careerStartSeason:S.season
 };
 ENGLAND_PLAYER_OVERVIEW.push(player);
 hiddenContractRecord('prospect_emerges',player,{club,age});
 return player;
}
function hiddenRetirePlayer(p,ct,reason='career_end'){
 if(p.retired)return;
 p.retired=true;
 p.eligible='Retired';
 ct.status='retired';
 ct.renewalState='retired';
 ct.lastOutcome='retired';
 hiddenContractRecord('retirement',p,ct,{reason,age:p.age,caps:p.caps});
 let important=p.status==='Key Player'||p.status==='First Choice'||(p.caps||0)>=40;
 if(important)notify('England player retirement',`${p.name} has retired from professional rugby. England's player pool will need to adjust.`,'neutral');
 hiddenGenerateProspect(p.pos,p.group);
}
function hiddenSelectionImpactForOverseas(p,ct){
 let policy=ensureEnglandSelectionPolicy();
 if(policy.overseasMode==='open')return {eligible:true,reason:'open'};
 if(policy.veteranCapExemption && (p.caps||0)>=policy.veteranCapThreshold)return {eligible:true,reason:'veteran_cap_exemption'};
 if(policy.overseasMode==='service'){
  return {eligible:(ct.englishServiceYears||0)>=policy.serviceYears,reason:'service'};
 }
 if(policy.overseasMode==='exceptions'){
  return {eligible:false,reason:'exception_required'};
 }
 return {eligible:false,reason:'domestic_only'};
}
function hiddenPickDomesticClub(p,ct){
 p3Ensure();
 let current=hiddenClubName(ct.club);
 let options=S.p3.clubs.filter(c=>c.name!==current);
 if(!options.length)return null;
 let scored=options.map(c=>{
  p3EnsureClubFinanceProfile(c);
  let hm=p3RecalcHiddenMods(c);
  let score=(c.squad||70)*.34+(c.finance||60)*.18+(c.financeProfile.ownerCommitment||65)*.15+hm.recruitment*.5+Math.random()*18;
  return {c,score};
 }).sort((a,b)=>b.score-a.score);
 return scored[0].c;
}
function hiddenStartNewClubDeal(p,ct,newClub,years){
 let dealYears=years||hiddenContractLengthYears(p,ct);
 let expiry=new Date(S.date+'T12:00:00');

function hiddenResolveExpiredContract(p,ct){
 if(ct.status!=='expired_unresolved')return;
 let age=p.age||25;
 if(Math.random()<hiddenRetirementChance(p,ct)*1.35){
  hiddenRetirePlayer(p,ct,'contract_expiry');
  return;
 }

 let market=hiddenPlayerMarketValueScore(p,ct);
 let domestic=ct.domesticInterest||0;
 let overseas=ct.overseasInterest||0;
 let policy=ensureEnglandSelectionPolicy();
 let capExempt=policy.veteranCapExemption && (p.caps||0)>=policy.veteranCapThreshold;
 let englandDeterrent=capExempt?0:(policy.overseasMode==='domestic'?22:policy.overseasMode==='exceptions'?14:policy.overseasMode==='service'?7:0);
 let englandAmbition=(ct.decision.england||50)/100;

 let domesticScore=domestic*.55+market*.22+ct.decision.loyalty*.14+Math.random()*22;
 let overseasScore=overseas*.58+ct.decision.money*.16+ct.decision.overseasInterest*.12+Math.random()*24-(englandDeterrent*englandAmbition);
 let freeAgentScore=18+Math.random()*18+(age>=33?8:0);

 if(domesticScore>=overseasScore && domesticScore>=freeAgentScore){
  let club=hiddenPickDomesticClub(p,ct);
  if(club){
   let from=ct.club;
   hiddenStartNewClubDeal(p,ct,club.name);
   hiddenContractRecord('domestic_move',p,ct,{from,to:club.name});
   return;
  }
 }

 if(overseasScore>=freeAgentScore){
  let marketChoice=HIDDEN_OVERSEAS_MARKETS[Math.floor(Math.random()*HIDDEN_OVERSEAS_MARKETS.length)];
  let from=ct.club;
  let impact=hiddenSelectionImpactForOverseas(p,ct);
  hiddenStartNewClubDeal(p,ct,`${marketChoice.label} (${marketChoice.country})`);
  ct.yearsAbroad=1;
  if(impact.eligible){
   p.eligible='England';
  }else{
   p.eligible='Ineligible — overseas';
   let important=p.status==='Key Player'||p.status==='First Choice'||(p.caps||0)>=20;
   if(important)hiddenRFUPlayerEligibilityEvent(p,{...ct,club:from},marketChoice,impact);
  }
  hiddenContractRecord('overseas_move',p,ct,{from,to:marketChoice.label,country:marketChoice.country,eligible:impact.eligible,policy:policy.overseasMode});
  return;
 }

 // One-season bridge deal if there is no convincing market outcome.
 hiddenStartNewClubDeal(p,ct,ct.club,1);
 ct.lastOutcome='bridge_deal';
 hiddenContractRecord('bridge_deal',p,ct,{age});
}

function hiddenDrainAgeBand(p){
 let age=p.age||25;
 return age<=24?'young':age<=29?'prime':age<=32?'senior':'veteran';
}
function hiddenDrainPlayerWeight(p,ct){
 let age=p.age||25,caps=p.caps||0;
 let status=p.status==='Key Player'?1.42:p.status==='First Choice'?1.20:1.0;
 let ageFactor=age<=23?1.34:age<=26?1.28:age<=29?1.22:age<=31?1.08:age<=33?.82:.56;
 let capsFactor=1+Math.min(.32,caps/250);
 let yearsAbroad=Math.max(0,ct.yearsAbroad||0);
 let persistence=1+Math.min(.30,yearsAbroad*.06);
 let generationFactor=p.generated?1.06:1.0;
 return status*ageFactor*capsFactor*persistence*generationFactor;
}
function hiddenPlayerDrainSnapshot(){
 let root=ensureHiddenClubContracts();
 let rows=[];
 ENGLAND_PLAYER_OVERVIEW.filter(p=>!p.retired).forEach(p=>{
  let ct=root.players[p.name];
  if(!ct||hiddenIsEnglishClub(ct.club))return;
  let weight=hiddenDrainPlayerWeight(p,ct);
  rows.push({
   player:p.name,
   age:p.age||0,
   caps:p.caps||0,
   status:p.status,
   band:hiddenDrainAgeBand(p),
   generated:!!p.generated,
   yearsAbroad:ct.yearsAbroad||0,
   weight:+weight.toFixed(3)
  });
 });
 let currentRaw=rows.reduce((n,x)=>n+x.weight,0);
 let currentIndex=Math.max(0,Math.min(100,currentRaw*5.3));
 let byBand={young:0,prime:0,senior:0,veteran:0};
 rows.forEach(x=>byBand[x.band]+=x.weight);
 let generated=rows.filter(x=>x.generated).reduce((n,x)=>n+x.weight,0);
 return {
  count:rows.length,
  currentIndex:+currentIndex.toFixed(1),
  weighted:+currentRaw.toFixed(2),
  byBand:{
   young:+byBand.young.toFixed(2),
   prime:+byBand.prime.toFixed(2),
   senior:+byBand.senior.toFixed(2),
   veteran:+byBand.veteran.toFixed(2)
  },
  generated:+generated.toFixed(2),
  rows
 };
}
function hiddenEnsureDrainState(){
 let root=ensureHiddenClubContracts();
 if(!root.playerDrain)root.playerDrain={
  currentIndex:0,

  concernLevel:'normal',
  lastSeason:null,
  history:[]
 };
 return root.playerDrain;
}
function hiddenDrainConcernLevel(structural,current){
 if(structural>=58||current>=72)return 'serious';
 if(structural>=34||current>=48)return 'emerging';
 return 'normal';
}
function hiddenPlayerDrainSeasonTick(){
 let state=hiddenEnsureDrainState();
 let snap=hiddenPlayerDrainSnapshot();
 state.currentIndex=snap.currentIndex;

 // Structural drain reacts slowly and remembers persistent player loss.
 let alpha=snap.currentIndex>=state.structuralIndex?.24:.14;
 state.structuralIndex=Math.max(0,Math.min(100,state.structuralIndex*(1-alpha)+snap.currentIndex*alpha));

 if(snap.currentIndex>=40)state.consecutivePressureSeasons++;
 else state.consecutivePressureSeasons=Math.max(0,state.consecutivePressureSeasons-1);

 state.concernLevel=hiddenDrainConcernLevel(state.structuralIndex,state.currentIndex);
 state.lastSeason=S.season;
 state.history.push({
  season:S.season,
  date:S.date,
  current:+state.currentIndex.toFixed(1),
  structural:+state.structuralIndex.toFixed(1),
  concern:state.concernLevel,
  count:snap.count,
  weighted:snap.weighted,
  young:snap.byBand.young,
  prime:snap.byBand.prime,
  senior:snap.byBand.senior,
  veteran:snap.byBand.veteran,

 });
 state.history=state.history.slice(-30);

 return {state,snap};
}

 if(!root.ecosystem)root.ecosystem={

 };

function hiddenEcosystemInvestmentProfile(){
 // V1.7 uses hidden/default investment assumptions until the visible RFU levers are built.
 // Future V1.8 can replace these with actual RFU budget decisions.
 if(!S.ecosystemInvestment)S.ecosystemInvestment={
  grassroots:1.0,
  pathway:1.0,
  infrastructure:1.0,
  professionalGame:1.0
 };
 return S.ecosystemInvestment;

function hiddenPushLag(key,value,years=12){
 let eco=hiddenEnsureEcosystem();
 if(!eco.years[key])eco.years[key]=[];
 eco.years[key].push(value);
 eco.years[key]=eco.years[key].slice(-years);
 return eco.years[key];
}
function hiddenLagAvg(arr,startAgo,endAgo,fallback=70){
 if(!arr||!arr.length)return fallback;
 let vals=[];
 for(let i=startAgo;i<=endAgo;i++){
  let idx=arr.length-1-i;
  if(idx>=0)vals.push(arr[idx]);
 }
 return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:fallback;
}
function hiddenClampHealth(v){return Math.max(5,Math.min(95,v))}
function hiddenEcosystemSeasonTick(){
 let eco=hiddenEnsureEcosystem();
 let inv=hiddenEcosystemInvestmentProfile();
 let drain=hiddenEnsureDrainState();
 let snap=hiddenPlayerDrainSnapshot();

 let gSpend=(inv.grassroots||0);
 let pSpend=(inv.pathway||0);
 let iSpend=(inv.infrastructure||0);
 let proSpend=(inv.professionalGame||0);

 hiddenPushLag('grassrootsInvestment',gSpend,15);
 hiddenPushLag('pathwayInvestment',pSpend,12);
 hiddenPushLag('infrastructureInvestment',iSpend,15);
 hiddenPushLag('professionalInvestment',proSpend,8);
 hiddenPushLag('structuralDrain',drain.structuralIndex||0,12);
 hiddenPushLag('currentDrain',drain.currentIndex||0,8);

 // Grassroots responds slowly to sustained funding and infrastructure.
 let grassLag=hiddenLagAvg(eco.years.grassrootsInvestment,2,5,1);
 let infraLag=hiddenLagAvg(eco.years.infrastructureInvestment,2,6,1);
 let grassrootsDelta=(grassLag-1)*1.65+(infraLag-1)*.65-(eco.clubFinancialPressure-30)*.008;
 eco.grassrootsHealth=hiddenClampHealth(eco.grassrootsHealth+grassrootsDelta);

 // Infrastructure is very slow-moving and difficult to rebuild.
 let infraDelta=(iSpend-1)*.85+(proSpend-1)*.20-(eco.clubFinancialPressure-35)*.004;
 eco.infrastructureHealth=hiddenClampHealth(eco.infrastructureHealth+infraDelta);

 // Pathway responds to direct investment, academy opportunity, and delayed grassroots health.
 let pathwayLag=hiddenLagAvg(eco.years.pathwayInvestment,1,4,1);
 let grassrootsLegacy=(eco.grassrootsHealth-70)*.025;
 // Academy opportunity is separate from pathway quality.
 // More vacancies can help young players get minutes without making coaching,
 // identification or academy infrastructure intrinsically better.
 let pathwayDelta=(pathwayLag-1)*1.55+grassrootsLegacy-(eco.clubFinancialPressure-30)*.012;
 eco.pathwayHealth=hiddenClampHealth(eco.pathwayHealth+pathwayDelta);

 // Moderate drain can open academy opportunities; heavy persistent drain eventually damages the system.
 let current=drain.currentIndex||0, structural=drain.structuralIndex||0;
 let opportunityTarget=50+Math.min(12,current*.22)-Math.max(0,structural-42)*.28;
 eco.academyOpportunity=hiddenClampHealth(eco.academyOpportunity*.72+opportunityTarget*.28);

 // Professional game: player drain hits quality/commercial first, but wage relief offsets some pressure.
 let wageRelief=Math.min(1.8,current*.025);
 let qualityPenalty=current*.055+structural*.085;
 let investmentSupport=(proSpend-1)*2.0;
 let commercialPull=(eco.commercialStrength-70)*.018;
 let professionalDelta=investmentSupport+wageRelief-qualityPenalty*.22+commercialPull;
 eco.professionalGameHealth=hiddenClampHealth(eco.professionalGameHealth+professionalDelta);

 // Commercial follows pro-game quality with lag and structural drain.
 let commercialDelta=(eco.professionalGameHealth-70)*.020-(structural*.024)+(proSpend-1)*.85;
 eco.commercialStrength=hiddenClampHealth(eco.commercialStrength+commercialDelta);

 // Financial pressure rises when pro/commercial strength falls, reduced by support.
 let pressureTarget=28+
  Math.max(0,68-eco.professionalGameHealth)*.42+
  Math.max(0,68-eco.commercialStrength)*.32+
  Math.max(0,structural-25)*.18-
  (proSpend-1)*8;
 eco.clubFinancialPressure=Math.max(5,Math.min(90,eco.clubFinancialPressure*.70+pressureTarget*.30));

 // Player production is heavily lagged: 5-10 year grassroots/pathway/infrastructure influence.
 hiddenPushLag('grassrootsHealth',eco.grassrootsHealth,15);
 hiddenPushLag('pathwayHealth',eco.pathwayHealth,12);
 hiddenPushLag('infrastructureHealth',eco.infrastructureHealth,15);
 let gLegacy=hiddenLagAvg(eco.years.grassrootsHealth,5,9,eco.grassrootsHealth);
 let pLegacy=hiddenLagAvg(eco.years.pathwayHealth,3,6,eco.pathwayHealth);
 let iLegacy=hiddenLagAvg(eco.years.infrastructureHealth,5,10,eco.infrastructureHealth);
 let productionTarget=gLegacy*.33+pLegacy*.44+iLegacy*.18+eco.academyOpportunity*.05;
 eco.playerProductionIndex=hiddenClampHealth(eco.playerProductionIndex*.78+productionTarget*.22);

 // England depth follows production with additional lag, plus current availability.
 hiddenPushLag('playerProduction',eco.playerProductionIndex,10);
 let prodLegacy=hiddenLagAvg(eco.years.playerProduction,3,6,eco.playerProductionIndex);
 let availabilityPenalty=Math.max(0,(snap.weighted||0)-5)*.7;
 let englandTarget=prodLegacy*.82+eco.pathwayHealth*.18-availabilityPenalty;
 eco.englandTalentDepth=hiddenClampHealth(eco.englandTalentDepth*.82+englandTarget*.18);

 eco.history.push({
  season:S.season,date:S.date,
  professional:+eco.professionalGameHealth.toFixed(1),
  pathway:+eco.pathwayHealth.toFixed(1),
  grassroots:+eco.grassrootsHealth.toFixed(1),
  infrastructure:+eco.infrastructureHealth.toFixed(1),
  pressure:+eco.clubFinancialPressure.toFixed(1),
  production:+eco.playerProductionIndex.toFixed(1),
  englandDepth:+eco.englandTalentDepth.toFixed(1),
  commercial:+eco.commercialStrength.toFixed(1),
  opportunity:+eco.academyOpportunity.toFixed(1),
  currentDrain:+current.toFixed(1),
  structuralDrain:+structural.toFixed(1)
 });
 eco.history=eco.history.slice(-40);

 // Thresholded RFU-facing structural events only.
 if(!eco.lastRFUConcern)eco.lastRFUConcern={};
 if(eco.professionalGameHealth<48 && eco.clubFinancialPressure>52 && eco.lastRFUConcern.professional!==S.season){
  eco.lastRFUConcern.professional=S.season;
  notify('Professional Game Review','Concerns are growing around the long-term competitiveness and financial resilience of the English professional game.','warn');
 }
 if(eco.pathwayHealth<45 && eco.playerProductionIndex<52 && eco.lastRFUConcern.pathway!==S.season){
  eco.lastRFUConcern.pathway=S.season;
  notify('England Pathway Review','Sustained pressure on the development pathway is beginning to affect the future England player pipeline.','warn');
 }
 if(eco.grassrootsHealth<42 && eco.lastRFUConcern.grassroots!==S.season){
  eco.lastRFUConcern.grassroots=S.season;
  notify('Grassroots Rugby Review','Long-term participation and community-game indicators have deteriorated enough to require RFU attention.','warn');
 }

 return eco;
}

function ensureNationalFacilities(){
 if(!S.facilityEstate)S.facilityEstate={version:1,annualOpex:0,lifetimeCapex:0,modules:{}};
 if(!S.facilityEstate.modules)S.facilityEstate.modules={};
 Object.entries(NATIONAL_FACILITY_DEFS).forEach(([k,d])=>{
  if(!S.facilityEstate.modules[k])S.facilityEstate.modules[k]={level:d.start};
  if(S.facilityEstate.modules[k].level==null)S.facilityEstate.modules[k].level=d.start;
 });
 if(S.facilityEstate.annualOpex==null)S.facilityEstate.annualOpex=0;
 if(S.facilityEstate.lifetimeCapex==null)S.facilityEstate.lifetimeCapex=0;
 ensureFinanceModel();
 S.financeModel.costs.facilityOperations=Math.max(0,S.facilityEstate.annualOpex||0);
 S.annualRevenue=Object.values(S.financeModel.revenue).reduce((a,b)=>a+b,0);
 S.annualSpend=Object.values(S.financeModel.costs).reduce((a,b)=>a+b,0);
 return S.facilityEstate;
}
function facilityDef(key){return NATIONAL_FACILITY_DEFS[key]}
function facilityLevel(key){ensureNationalFacilities();return S.facilityEstate.modules[key]?.level||0}
function activeFacilityProject(key){return (S.projects||[]).find(p=>!p.done&&p.type==='facility_upgrade'&&p.facilityKey===key)}
function facilityQuote(key){
 let d=facilityDef(key),level=facilityLevel(key),next=level+1;if(!d||next>d.max)return null;
 let cost=d.baseCost*(1+d.costScale*level),days=d.baseDays+90*level,opex=d.baseOpex*(1+.18*level),revenue={};
 Object.entries(d.revenue||{}).forEach(([k,v])=>revenue[k]=+(v*(1+.12*level)).toFixed(2));
 return {key,next,cost:+cost.toFixed(2),days,opex:+opex.toFixed(2),revenue,operatingSavings:+((d.operatingSavings||0)*(1+.10*level)).toFixed(2)};
}
function facilityPrereqReason(key){
 let d=facilityDef(key);if(!d)return 'Unknown facility';
 for(const [req,lvl] of Object.entries(d.requires||{}))if(facilityLevel(req)<lvl)return `Requires ${facilityDef(req).name} Level ${lvl}`;
 return '';
}
function facilityProjectBlockReason(key){
 let d=facilityDef(key),q=facilityQuote(key);if(!q)return d&&facilityLevel(key)>=d.max?'Maximum level reached':'Unavailable';
 let pre=facilityPrereqReason(key);if(pre)return pre;
 if(activeFacilityProject(key))return 'Upgrade already under construction';
 let active=(S.projects||[]).filter(p=>!p.done&&(p.type==='facility_upgrade'||p.type==='stadium'||p.type==='training')).length;
 if(active>=2)return 'RFU capital team is already managing two major national projects';
 if(S.balance<q.cost)return `Requires ${money(q.cost)} cash`;
 if(S.balance-q.cost<25)return 'Would take cash reserves below the £25m board liquidity floor';
 return '';
}
function facilityRevenueDelta(q){return Object.values(q?.revenue||{}).reduce((a,b)=>a+b,0)}
function facilityImpactSummary(key,q){
 let d=facilityDef(key),parts=[];if(q.opex)parts.push(`${money(q.opex)}/yr operating cost`);
 let rev=facilityRevenueDelta(q);if(rev)parts.push(`+${money(rev)}/yr revenue`);
 if(q.operatingSavings)parts.push(`${money(q.operatingSavings)}/yr operating saving`);
 if(d.effects?.capacity)parts.push(`+${d.effects.capacity.toLocaleString()} seats`);
 if(d.effects?.trainingQuality)parts.push('elite preparation');
 if(d.effects?.u20||d.effects?.pathwayU18)parts.push('age-grade pathway');
 if(d.effects?.welfare)parts.push('player welfare');
 return parts.join(' · ')||'Strategic infrastructure benefit';
}
function facilityPhase(p){
 let total=Math.max(1,new Date(p.complete)-new Date(p.started||S.date)),done=Math.max(0,new Date(S.date)-new Date(p.started||S.date));
 let pct=Math.max(0,Math.min(100,Math.round(done/total*100)));return {pct,label:pct<15?'Mobilisation':pct<65?'Construction':pct<90?'Fit-out':'Commissioning'};
}
function facilityModuleCard(key){
 let d=facilityDef(key),lvl=facilityLevel(key),q=facilityQuote(key),proj=activeFacilityProject(key),block=facilityProjectBlockReason(key),ph=proj?facilityPhase(proj):null;
 return `<div class="estate-module">
  <div class="estate-module-head"><div><div class="small muted">${d.group==='training'?'PERFORMANCE CAMPUS':'NATIONAL STADIUM'}</div><h4>${d.name}</h4></div><span class="estate-level">${lvl>=d.max?'MAX':'Level '+lvl+' / '+d.max}</span></div>
  <p>${d.desc}</p>
  ${proj?`<div class="estate-build"><div><b>${ph.label}</b><span>${ph.pct}% · completes ${fmtDate(proj.complete)}</span></div><div class="estate-progress"><i style="width:${ph.pct}%"></i></div></div>`:''}
  ${q?`<div class="estate-next"><span>Next level</span><b>${money(q.cost)}</b><small>${Math.round(q.days/30)} months · ${facilityImpactSummary(key,q)}</small></div>`:'<div class="estate-next"><span>Facility status</span><b>Fully developed</b><small>No further expansion currently available.</small></div>'}
  ${q?`<button class="btn ${block?'':'primary'} estate-upgrade" data-facility-upgrade="${key}" ${block?'disabled':''}>${proj?'Under construction':'Plan Level '+q.next+' upgrade'}</button>`:''}
  ${block&&!proj&&q?`<div class="estate-lock">${block}</div>`:''}
 </div>`;
}

function programmeOutcomeTick(){
 // Long-term programme effects are intentionally slow.
 // Quality above/below baseline creates momentum; relationships alter delivery effectiveness.
 let communityTrust=.75+S.relationships.community/200;
 let clubTrust=.85+S.relationships.clubs/300;
 let playerTrust=.85+S.relationships.players/300;

 let mappings=[
  ['grassroots',65,communityTrust],
  ['schools',64,communityTrust],
  ['academies',70,clubTrust],
  ['coaches',66,communityTrust],
  ['referees',62,communityTrust],
  ['u20',72,playerTrust]
 ];
 mappings.forEach(([k,base,mult])=>{
   let score=S.programmes[k]?.score??base;
   let delta=((score-base)/100)*mult;
   P2.programmeMomentum[k]=(P2.programmeMomentum[k]||0)+delta;
  });

 // Participation changes slightly each month from sustained quality.
 let gp=P2.programmeMomentum.grassroots||0;
 let sp=P2.programmeMomentum.schools||0;
 S.participation.registered=Math.max(100000,Math.round(S.participation.registered*(1+gp/12000)));
 S.participation.youth=Math.max(50000,Math.round(S.participation.youth*(1+sp/10000)));

 // Convert sustained academy/U20/coaching quality into tiny elite movement over time.
 let pathway=(P2.programmeMomentum.academies||0)+(P2.programmeMomentum.u20||0)*.8+(P2.programmeMomentum.coaches||0)*.35;
 if(Math.abs(pathway)>=4){
   let shift=pathway>0?.15:-.15;
   S.programmes.elite.score=clamp(S.programmes.elite.score+shift);
   P2.programmeMomentum.academies*=.7;
   P2.programmeMomentum.u20*=.7;
   P2.programmeMomentum.coaches*=.8;
 }
 p2Save();
}

function passiveRelationshipDrift(){
 Object.keys(S.relationships).forEach(k=>{
   let v=S.relationships[k];
   // Confidence naturally normalises over time unless reinforced.
   if(v>82)S.relationships[k]=Math.max(82,v-0.35);
   else if(v<28)S.relationships[k]=Math.min(28,v+0.20);
 });
}


function advanceToNextInternational(){
 if(ACTIVE_MATCH_SESSION){ACTIVE_MATCH_SESSION.stage==='intro'?showInternationalIntro(ACTIVE_MATCH_SESSION.event):renderInternationalMatchSession();return}
 if(P2.pendingQuestion){resumePendingQuestion();return}

 let target=nextInternationalFixture(),safety=0;

 // When there is no Test left in the current season, keep the hidden world
 // moving until season rollover creates the next England programme.
 while(!target && safety<400){
   let old=S.date;
   S.date=addDays(S.date,1);
   S.weekCounter++;
   dailyTick(old,S.date);
   processDueEvents();
   safety++;
   if(ACTIVE_MATCH_SESSION){ACTIVE_MATCH_SESSION.stage==='intro'?showInternationalIntro(ACTIVE_MATCH_SESSION.event):renderInternationalMatchSession();return}
   if(P2.pendingQuestion){render();refreshPendingQuestionUI();return}
   target=nextInternationalFixture();
 }

 if(!target){
   notify('No England fixture found','No England fixture could be found within the next simulation year.','negative');
   render();return;
 }

 const targetDate=target.date;
 while(S.date<targetDate && safety<800){
   let old=S.date;
   S.date=addDays(S.date,1);
   S.weekCounter++;
   dailyTick(old,S.date);
   processDueEvents();
   safety++;

   if(ACTIVE_MATCH_SESSION){ACTIVE_MATCH_SESSION.stage==='intro'?showInternationalIntro(ACTIVE_MATCH_SESSION.event):renderInternationalMatchSession();return}
   if(P2.pendingQuestion){
     P2.pendingAdvanceTarget=targetDate;
     p2Save();
     render();
     refreshPendingQuestionUI();
     return;
   }
 }
 render();
}
